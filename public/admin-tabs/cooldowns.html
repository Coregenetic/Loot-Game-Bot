<div class="flex flex-col h-full">
  <div class="glass-card border border-white/10 rounded-t-2xl p-4 flex flex-wrap items-center justify-between gap-4 shrink-0">
    <div class="flex items-center gap-3">
      <div class="relative">
        <svg class="w-4 h-4 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input class="bg-white/[0.03] border border-white/10 rounded-xl pl-9 pr-4 py-2 text-sm text-white focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none w-64 transition-all" placeholder="Spieler suchen..." oninput="filterCooldowns(this.value)">
      </div>
      <button class="btn sm danger" onclick="clearAllCooldowns()">Alle löschen</button>
      <button class="btn sm" onclick="loadCooldowns()">↺ Refresh</button>
    </div>
    <span id="cdCount" class="text-xs font-mono text-slate-400 bg-white/[0.03] px-3 py-1.5 rounded-lg border border-white/10">—</span>
  </div>
  <div class="flex-1 glass-card border-x border-b border-white/10 rounded-b-2xl overflow-y-auto p-2" id="cooldownList">
  </div>
</div>
