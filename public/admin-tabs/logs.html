<div class="h-full flex flex-col">
  <div class="glass-card border border-slate-700/50 rounded-t-2xl p-4 flex flex-wrap items-center justify-between gap-4 shrink-0">
    <div class="flex flex-wrap gap-2">
      <button class="filter-btn text-[10px] font-mono px-3 py-1.5 rounded-lg border border-slate-700 text-slate-400 hover:text-slate-200 transition-colors" id="filter-ALL" onclick="setFilter('ALL')">ALL</button>
      <button class="filter-btn text-[10px] font-mono px-3 py-1.5 rounded-lg border border-slate-700 text-slate-400 hover:text-slate-200 transition-colors" id="filter-CMD" onclick="setFilter('CMD')">CMD</button>
      <button class="filter-btn text-[10px] font-mono px-3 py-1.5 rounded-lg border border-slate-700 text-slate-400 hover:text-slate-200 transition-colors" id="filter-BOT" onclick="setFilter('BOT')">BOT</button>
      <button class="filter-btn text-[10px] font-mono px-3 py-1.5 rounded-lg border border-slate-700 text-slate-400 hover:text-slate-200 transition-colors" id="filter-ERROR" onclick="setFilter('ERROR')">ERROR</button>
      <button class="filter-btn text-[10px] font-mono px-3 py-1.5 rounded-lg border border-slate-700 text-slate-400 hover:text-slate-200 transition-colors" id="filter-API" onclick="setFilter('API')">API</button>
      <button class="filter-btn text-[10px] font-mono px-3 py-1.5 rounded-lg border border-slate-700 text-slate-400 hover:text-slate-200 transition-colors" id="filter-INFO" onclick="setFilter('INFO')">INFO</button>
    </div>

    <div class="flex items-center gap-4">
      <label class="flex items-center gap-2 cursor-pointer text-[10px] font-mono text-slate-400 hover:text-slate-200">
        <input type="checkbox" id="autoScroll" checked class="w-3.5 h-3.5 rounded border-slate-700 bg-slate-900 text-emerald-500 focus:ring-emerald-500 focus:ring-offset-slate-900">
        AUTO-SCROLL
      </label>
      <button class="text-[10px] font-mono px-3 py-1.5 rounded-lg border border-slate-700 text-slate-400 hover:bg-slate-800 hover:text-white transition-colors" onclick="clearLogDisplay()">LEEREN</button>
    </div>
  </div>

  <div class="flex-1 glass-card border-x border-b border-slate-700/50 rounded-b-2xl p-4 overflow-y-auto" id="logContainer">
  </div>
</div>
