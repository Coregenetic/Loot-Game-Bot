<div class="h-full flex flex-col">
  <div class="glass-card border border-white/10 rounded-t-2xl p-4 flex flex-wrap items-center justify-between gap-4 shrink-0">
    <div class="flex flex-wrap gap-2 items-center">
      <button class="filter-btn" id="filter-ALL" onclick="setFilter('ALL')">ALL</button>
      <button class="filter-btn" id="filter-CMD" onclick="setFilter('CMD')">CMD</button>
      <button class="filter-btn" id="filter-BOT" onclick="setFilter('BOT')">BOT</button>
      <button class="filter-btn" id="filter-ERROR" onclick="setFilter('ERROR')">ERROR</button>
      <button class="filter-btn" id="filter-API" onclick="setFilter('API')">API</button>
      <button class="filter-btn" id="filter-INFO" onclick="setFilter('INFO')">INFO</button>
      <div class="w-px h-5 bg-white/10 mx-1"></div>
      <select id="categoryFilter" onchange="setCategoryFilter(this.value)" class="text-[10px] font-mono px-2 py-1.5 rounded-lg border border-white/10 bg-white/[0.03] text-slate-400 outline-none focus:border-emerald-500">
        <option value="ALL">Alle Quellen</option>
      </select>
    </div>

    <div class="flex items-center gap-4">
      <label class="flex items-center gap-2 cursor-pointer text-[10px] font-mono text-slate-400 hover:text-slate-200">
        <input type="checkbox" id="autoScroll" checked class="w-3.5 h-3.5 rounded border-white/10 bg-white/[0.04] text-emerald-500 focus:ring-emerald-500 focus:ring-offset-slate-900">
        AUTO-SCROLL
      </label>
      <button class="btn sm" onclick="clearLogDisplay()">LEEREN</button>
    </div>
  </div>

  <div class="flex-1 glass-card border-x border-b border-white/10 rounded-b-2xl p-4 overflow-y-auto" id="logContainer">
  </div>
</div>
