<div class="space-y-6 pb-4">

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="glass-card border border-slate-700/50 rounded-2xl flex flex-col overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-700/50 text-[10px] font-mono tracking-widest text-slate-400 uppercase bg-slate-900/30">DASHBOARD USERS</div>
      <div class="flex-1 overflow-y-auto p-2 space-y-1.5" id="userList"></div>
    </div>

    <div class="glass-card border border-slate-700/50 rounded-2xl h-fit">
      <div class="px-5 py-4 border-b border-slate-700/50 text-[10px] font-mono tracking-widest text-slate-400 uppercase bg-slate-900/30">NEUEN USER ANLEGEN</div>
      <div class="p-6 space-y-4">
        <div>
          <label class="block text-[10px] font-mono text-slate-400 uppercase tracking-widest mb-1.5">Username</label>
          <input class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none transition-all" id="newUsername">
        </div>
        <div>
          <label class="block text-[10px] font-mono text-slate-400 uppercase tracking-widest mb-1.5">Passwort</label>
          <input type="password" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none transition-all" id="newPassword" placeholder="min. 10 Zeichen">
        </div>
        <div>
          <label class="block text-[10px] font-mono text-slate-400 uppercase tracking-widest mb-1.5">Rolle</label>
          <select id="newRole" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none transition-all">
            <option value="mod">Mod</option>
            <option value="admin">Admin</option>
            <option value="superadmin">Superadmin</option>
          </select>
        </div>
        <div id="userMsg" class="text-xs hidden"></div>
        <button class="w-full px-4 py-2.5 mt-2 rounded-xl bg-emerald-500 text-slate-950 font-semibold tracking-wide hover:bg-emerald-400 transition-colors shadow-[0_0_15px_rgba(16,185,129,0.2)]" onclick="createUser()">USER ANLEGEN</button>
      </div>
    </div>
  </div>

  <div class="glass-card border border-slate-700/50 rounded-2xl overflow-hidden">
    <div class="px-5 py-4 border-b border-slate-700/50 text-[10px] font-mono tracking-widest text-slate-400 uppercase bg-slate-900/30 flex items-center justify-between">
      <span>ROLLEN-RECHTE</span>
      <span class="text-slate-600 normal-case font-sans">Du bestimmst hier, was Admin/Mod sehen & tun dürfen</span>
    </div>
    <div class="p-5 overflow-x-auto">
      <table class="w-full text-sm" id="permMatrix">
        <thead>
          <tr class="text-left text-[10px] font-mono text-slate-500 uppercase tracking-widest">
            <th class="pb-3 pr-4">Bereich</th>
            <th class="pb-3 px-4 text-center">Superadmin</th>
            <th class="pb-3 px-4 text-center">Admin</th>
            <th class="pb-3 px-4 text-center">Mod</th>
          </tr>
        </thead>
        <tbody id="permMatrixBody"></tbody>
      </table>
    </div>
  </div>

  <div class="glass-card border border-slate-700/50 rounded-2xl overflow-hidden">
    <div class="px-5 py-4 border-b border-slate-700/50 text-[10px] font-mono tracking-widest text-slate-400 uppercase bg-slate-900/30">AUDIT LOG</div>
    <div class="p-2 max-h-72 overflow-y-auto space-y-1" id="auditLog"></div>
  </div>

</div>
