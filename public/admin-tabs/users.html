<div class="space-y-6 pb-4">

  <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
    <div class="card p4">
      <div class="lbl">User Gesamt</div>
      <div class="text-xl font-semibold text-white font-mono mt-1" id="userStatTotal">—</div>
    </div>
    <div class="card p4">
      <div class="lbl">Superadmin</div>
      <div class="text-xl font-semibold text-amber-400 font-mono mt-1" id="userStatSuperadmin">—</div>
    </div>
    <div class="card p4">
      <div class="lbl">Admin</div>
      <div class="text-xl font-semibold text-blue-400 font-mono mt-1" id="userStatAdmin">—</div>
    </div>
    <div class="card p4">
      <div class="lbl">Mod</div>
      <div class="text-xl font-semibold text-slate-300 font-mono mt-1" id="userStatMod">—</div>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="card pad0 flex flex-col overflow-hidden">
      <div class="lbl px-5 py-4 border-b border-white/10 bg-white/[0.03]">DASHBOARD USERS</div>
      <div class="flex-1 overflow-y-auto p-2 space-y-1.5" id="userList"></div>
    </div>

    <div class="card pad0 h-fit">
      <div class="lbl px-5 py-4 border-b border-white/10 bg-white/[0.03]">NEUEN USER ANLEGEN</div>
      <div class="p-6 space-y-4">
        <div>
          <label class="lbl block mb-1.5">Username</label>
          <input class="input" id="newUsername">
        </div>
        <div>
          <label class="lbl block mb-1.5">Passwort</label>
          <input type="password" class="input" id="newPassword" placeholder="min. 10 Zeichen">
        </div>
        <div>
          <label class="lbl block mb-1.5">Rolle</label>
          <select id="newRole" class="input">
            <option value="mod">Mod</option>
            <option value="admin">Admin</option>
            <option value="superadmin">Superadmin</option>
          </select>
        </div>
        <div id="userMsg" class="text-xs hidden"></div>
        <button class="btn primary w-full mt-2" onclick="createUser()">USER ANLEGEN</button>
      </div>
    </div>
  </div>

  <div class="card pad0 overflow-hidden">
    <div class="lbl px-5 py-4 border-b border-white/10 bg-white/[0.03] flex items-center justify-between">
      <span>ROLLEN-RECHTE</span>
      <span class="text-slate-600 normal-case font-sans">Du bestimmst hier, was Admin/Mod sehen & tun dürfen</span>
    </div>
    <div class="p-5 overflow-x-auto">
      <table class="w-full text-sm" id="permMatrix">
        <thead>
          <tr class="lbl text-left">
            <th class="pb-3 pr-4">Bereich</th>
            <th class="pb-3 px-4 text-center">Superadmin</th>
            <th class="pb-3 px-4 text-center">Admin</th>
            <th class="pb-3 px-4 text-center">Mod</th>
          </tr>
        </thead>
        <tbody id="permMatrixBody"></tbody>
      </table>
    </div>
  </div>

  <div class="card pad0 overflow-hidden">
    <div class="lbl px-5 py-4 border-b border-white/10 bg-white/[0.03]">AUDIT LOG</div>
    <div class="p-2 max-h-72 overflow-y-auto space-y-1" id="auditLog"></div>
  </div>

</div>
