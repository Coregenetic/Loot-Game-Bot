<div class="ov">

  <!-- Kennzahlen -->
  <div class="ov-kpis">
    <section class="card kpi rise" style="--i:0">
      <div style="display:flex;align-items:center;justify-content:space-between"><span class="lbl">Bot</span><span class="ibox green"><svg class="ic"><use href="#i-activity"/></svg></span></div>
      <div class="v" id="kpi-bot-v">—</div>
      <div class="n" id="kpi-bot-n">&nbsp;</div>
    </section>
    <section class="card kpi rise" style="--i:1">
      <div style="display:flex;align-items:center;justify-content:space-between"><span class="lbl">Uptime</span><span class="ibox violet"><svg class="ic"><use href="#i-clock"/></svg></span></div>
      <div class="v" id="kpi-up-v">—</div>
      <div class="n">seit dem letzten Neustart</div>
    </section>
    <section class="card kpi rise" style="--i:2">
      <div style="display:flex;align-items:center;justify-content:space-between"><span class="lbl">Ping</span><span class="ibox blue"><svg class="ic"><use href="#i-wifi"/></svg></span></div>
      <div class="v" id="kpi-ping-v">—</div>
      <div class="n" id="kpi-ping-n">&nbsp;</div>
    </section>
    <section class="card kpi rise" style="--i:3">
      <div style="display:flex;align-items:center;justify-content:space-between"><span class="lbl">Server</span><span class="ibox pink"><svg class="ic"><use href="#i-server"/></svg></span></div>
      <div class="v" id="kpi-srv-v">—</div>
      <div class="n" id="kpi-srv-n">&nbsp;</div>
    </section>
  </div>

  <div class="ov-two">

    <!-- Bot-Verhalten -->
    <section class="card panel-card rise" style="--i:4">
      <div class="lbl">Bot-Verhalten</div>
      <div class="setrow" style="margin-top:6px">
        <span class="ibox lg gold"><svg class="ic"><use href="#i-wrench"/></svg></span>
        <div class="t"><b>Wartungsmodus</b><span>Bot antwortet nur Admins</span></div>
        <span id="ov-maintenance-pill" class="pill green">Inaktiv</span>
      </div>
      <div class="setrow">
        <span class="ibox lg violet"><svg class="ic"><use href="#i-trophy"/></svg></span>
        <div class="t"><b>Turnier-Modus</b><span>Wertung mit eigenen Regeln</span></div>
        <span id="ov-tournament-pill" class="pill green">Inaktiv</span>
      </div>
    </section>

    <!-- Server -->
    <section class="card panel-card rise" style="--i:5">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div class="lbl">Hetzner CX23</div>
        <span id="ov-hetzner-status" class="pill">—</span>
      </div>
      <div class="gauge">
        <div><div class="h"><span>CPU</span><span id="ov-cpu-label">—</span></div><div class="bar"><i id="ov-cpu-bar" style="width:0%"></i></div></div>
        <div><div class="h"><span>RAM</span><span id="ov-ram-label">—</span></div><div class="bar"><i id="ov-ram-bar" style="width:0%"></i></div></div>
        <div><div class="h"><span>Disk</span><span id="ov-disk-label">—</span></div><div class="bar"><i id="ov-disk-bar" style="width:0%"></i></div></div>
      </div>
      <button onclick="navigateTo('server')" data-permission="server:manage" class="btn block" style="margin-top:18px">Details und Controls</button>
    </section>
  </div>

  <!-- Schnellzugriff -->
  <div class="ov-quick">
    <button onclick="navigateTo('events')" data-permission="events:manage" class="card quick hoverable rise" style="--i:6">
      <span class="ibox lg gold"><svg class="ic"><use href="#i-bolt"/></svg></span>
      <span class="t"><b>Live Events</b><span>Events starten und steuern</span></span>
      <svg class="ic sm dim"><use href="#i-chev"/></svg>
    </button>
    <button onclick="navigateTo('cooldowns')" data-permission="cooldowns:manage" class="card quick hoverable rise" style="--i:7">
      <span class="ibox lg blue"><svg class="ic"><use href="#i-clock"/></svg></span>
      <span class="t"><b>Cooldowns</b><span>Spieler freigeben</span></span>
      <svg class="ic sm dim"><use href="#i-chev"/></svg>
    </button>
    <button onclick="navigateTo('logs')" data-permission="logs:view" class="card quick hoverable rise" style="--i:8">
      <span class="ibox lg violet"><svg class="ic"><use href="#i-terminal"/></svg></span>
      <span class="t"><b>Bot Log</b><span>Live-Log ansehen</span></span>
      <svg class="ic sm dim"><use href="#i-chev"/></svg>
    </button>
  </div>

  <!-- Live-Feed -->
  <section class="card panel-card rise" style="--i:9">
    <div class="feed-head">
      <div class="lbl" style="display:flex;align-items:center;gap:10px">
        <span class="dot" style="color:var(--green)"></span>Live-Feed
        <span id="liveFeedStatus" class="mono dim" style="font-weight:500;letter-spacing:0;text-transform:none;font-size:12px">verbinde…</span>
      </div>
      <div class="fchips" id="liveFeedFilters">
        <button type="button" class="fchip on" data-feed="all" onclick="setFeedFilter('all')">Alle</button>
        <button type="button" class="fchip" data-feed="loot" onclick="setFeedFilter('loot')">Loot</button>
        <button type="button" class="fchip" data-feed="death" onclick="setFeedFilter('death')">Tode</button>
        <button type="button" class="fchip" data-feed="bot" onclick="setFeedFilter('bot')">Bot</button>
      </div>
    </div>
    <div id="liveFeedList"><div class="feed-empty">Warte auf Aktivität…</div></div>
  </section>

</div>
