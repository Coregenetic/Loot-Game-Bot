<div class="h-full flex gap-4">

  <!-- LEFT: Player List -->
  <div class="w-80 shrink-0 flex flex-col h-full">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-sm font-semibold text-white tracking-wide uppercase">Spieler</h2>
      <span id="playerCount" class="text-xs font-mono text-slate-500">— Gesamt</span>
    </div>
    <div class="relative mb-3">
      <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <input class="w-full bg-slate-900/50 border border-slate-700 rounded-xl pl-9 pr-4 py-2 text-sm text-white focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none transition-all" placeholder="Spieler suchen..." oninput="filterPlayers(this.value)">
    </div>
    <div id="playerList" class="flex-1 overflow-y-auto space-y-1 pr-1"></div>
  </div>

  <!-- RIGHT: Player Detail -->
  <div class="flex-1 h-full overflow-y-auto">
    <div id="playerEmpty" class="h-full flex flex-col items-center justify-center text-center">
      <svg class="w-16 h-16 text-slate-700 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      <p class="text-slate-500 text-sm font-mono">Spieler auswählen</p>
      <p class="text-slate-600 text-xs mt-1">Klicke auf einen Spieler um Details zu sehen</p>
    </div>

    <div id="playerDetail" class="hidden space-y-4">

      <div class="glass-card rounded-2xl border border-slate-700/50 p-5">
        <div class="flex items-start justify-between">
          <div class="flex items-center gap-4">
            <div class="w-14 h-14 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center">
              <span class="text-2xl font-bold text-emerald-400 font-mono" id="pd-avatar">—</span>
            </div>
            <div>
              <div class="text-xl font-bold text-white" id="pd-name">—</div>
              <div class="flex items-center gap-2 mt-1">
                <span class="text-xs font-mono text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded-lg" id="pd-rank">—</span>
                <span id="pd-kappa" class="text-xs font-mono text-purple-400 bg-purple-500/10 border border-purple-500/20 px-2 py-0.5 rounded-lg hidden">🎒 KAPPA</span>
                <span id="pd-prestige" class="text-xs font-mono text-amber-400 bg-amber-500/10 border border-amber-500/20 px-2 py-0.5 rounded-lg hidden">✦ PRESTIGE</span>
              </div>
            </div>
          </div>
          <button onclick="clearUserCD_player()" class="px-3 py-1.5 rounded-lg bg-rose-500/10 border border-rose-500/30 text-rose-400 hover:bg-rose-500/20 text-xs font-mono transition-colors">CD Reset</button>
        </div>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div class="glass-card rounded-xl border border-slate-700/50 p-4">
          <div class="text-xs font-mono text-slate-500 uppercase tracking-wide mb-1">Level</div>
          <div class="text-2xl font-bold text-white" id="pd-level">—</div>
          <div class="text-xs text-slate-500 mt-1" id="pd-xp">— XP</div>
        </div>
        <div class="glass-card rounded-xl border border-slate-700/50 p-4">
          <div class="text-xs font-mono text-slate-500 uppercase tracking-wide mb-1">Raids Total</div>
          <div class="text-2xl font-bold text-white" id="pd-raids">—</div>
          <div class="text-xs text-emerald-400 mt-1" id="pd-survived">— überlebt</div>
        </div>
        <div class="glass-card rounded-xl border border-slate-700/50 p-4">
          <div class="text-xs font-mono text-slate-500 uppercase tracking-wide mb-1">Gestorben</div>
          <div class="text-2xl font-bold text-rose-400" id="pd-died">—</div>
          <div class="text-xs text-slate-500 mt-1" id="pd-survrate">— % Survival</div>
        </div>
        <div class="glass-card rounded-xl border border-slate-700/50 p-4">
          <div class="text-xs font-mono text-slate-500 uppercase tracking-wide mb-1">Stash Wert</div>
          <div class="text-2xl font-bold text-amber-400" id="pd-stash">—</div>
          <div class="text-xs text-slate-500 mt-1" id="pd-items-count">— Items</div>
        </div>
      </div>

      <div class="glass-card rounded-2xl border border-slate-700/50 p-5">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-sm font-semibold text-white uppercase tracking-wide">Inventar</h3>
          <span class="text-xs font-mono text-slate-500" id="pd-inv-count">— Items</span>
        </div>
        <div id="pd-inventory" class="space-y-1.5 max-h-64 overflow-y-auto pr-1">
          <p class="text-slate-600 text-xs font-mono">Kein Inventar</p>
        </div>
      </div>

    </div>
  </div>
</div>
