<h1 id="page-title" class="text-xl sm:text-2xl font-bold text-white tracking-widest uppercase mb-2">Dashboard</h1>

<div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
  <div class="glass-card border border-emerald-500/20 rounded-2xl p-5 relative overflow-hidden group">
    <div class="absolute top-0 right-0 p-4 opacity-10 text-emerald-500 group-hover:scale-110 transition-transform"><svg class="w-16 h-16" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div>
    <div class="text-[10px] font-mono text-emerald-500 tracking-[0.1em] uppercase mb-1">Spieler Total</div>
    <div class="text-4xl font-bold text-white tracking-tight" id="stat-players">—</div>
    <div class="text-xs text-slate-400 mt-2">registrierte Accounts</div>
  </div>

  <div class="glass-card border border-blue-500/20 rounded-2xl p-5 relative overflow-hidden group">
    <div class="absolute top-0 right-0 p-4 opacity-10 text-blue-500 group-hover:scale-110 transition-transform"><svg class="w-16 h-16" fill="currentColor" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg></div>
    <div class="text-[10px] font-mono text-blue-500 tracking-[0.1em] uppercase mb-1">Items in Pool</div>
    <div class="text-4xl font-bold text-white tracking-tight" id="stat-items">—</div>
    <div class="text-xs text-slate-400 mt-2">lootbare Items</div>
  </div>

  <div class="glass-card border border-amber-500/20 rounded-2xl p-5 relative overflow-hidden group">
    <div class="absolute top-0 right-0 p-4 opacity-10 text-amber-500 group-hover:scale-110 transition-transform"><svg class="w-16 h-16" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div>
    <div class="text-[10px] font-mono text-amber-500 tracking-[0.1em] uppercase mb-1">Aktive Cooldowns</div>
    <div class="text-4xl font-bold text-white tracking-tight" id="stat-cooldowns">—</div>
    <div class="text-xs text-slate-400 mt-2">Spieler im CD</div>
  </div>

  <div class="glass-card border border-purple-500/20 rounded-2xl p-5 relative overflow-hidden group">
    <div class="absolute top-0 right-0 p-4 opacity-10 text-purple-500 group-hover:scale-110 transition-transform"><svg class="w-16 h-16" fill="currentColor" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></div>
    <div class="text-[10px] font-mono text-purple-500 tracking-[0.1em] uppercase mb-1">Messages</div>
    <div class="text-4xl font-bold text-white tracking-tight" id="stat-messages">—</div>
    <div class="text-xs text-slate-400 mt-2">Chat-Nachrichten</div>
  </div>
</div>

<div class="glass-card border border-slate-700/50 rounded-2xl p-6">
  <div class="flex items-center gap-3 mb-6">
    <div class="w-1 h-5 bg-emerald-500 rounded-full"></div>
    <h2 class="text-xs font-mono tracking-widest text-slate-300 uppercase">Schnellaktionen</h2>
  </div>

  <div class="flex flex-wrap gap-4">
    <button class="px-4 py-2 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 hover:bg-rose-500/20 text-xs font-mono tracking-wide transition-colors" onclick="clearAllCooldowns()">
      🗑 Alle CDs löschen
    </button>
    <button class="px-4 py-2 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-400 hover:bg-amber-500/20 text-xs font-mono tracking-wide transition-colors" onclick="clearCache()">
      ⟳ Cache leeren
    </button>
    <button class="px-4 py-2 rounded-xl bg-slate-800/50 border border-slate-700 text-slate-300 hover:bg-slate-700 hover:text-white text-xs font-mono tracking-wide transition-colors" onclick="loadStats()">
      ↺ Aktualisieren
    </button>
    <button id="dashTournamentBtn" onclick="dashToggleTournament()"
      class="px-4 py-2 rounded-xl bg-blue-500/10 border border-blue-500/30 text-blue-400 hover:bg-blue-500/20 text-xs font-mono tracking-wide transition-colors">
      🏆 Turnier-Modus: AUS
    </button>
  </div>
  <div id="quickActionMsg" class="hidden"></div>
</div>
