<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Admin-Login — Loot-Game Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/hub-ui.css">
<script defer src="js/passkey.js"></script>
<script defer src="js/login-passkey.js"></script>
<style>
  body{min-height:100vh;display:grid;place-items:center;background-image:
    radial-gradient(900px 520px at 100% 0%,rgba(255,92,138,.16),transparent 62%),
    radial-gradient(1000px 640px at 0% 0%,rgba(91,140,255,.16),transparent 60%),
    radial-gradient(700px 500px at 50% 110%,rgba(165,107,255,.12),transparent 60%)}
  .orb{position:fixed;border-radius:50%;filter:blur(60px);pointer-events:none;z-index:0;animation:float 9s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .wrap{position:relative;z-index:1;width:100%;max-width:440px;padding:28px 16px}
  .login{padding:34px;display:flex;flex-direction:column;gap:16px}
  .login label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700}
  .login .input{min-height:50px}
  .btn.xl{min-height:54px;font-size:15px}
  .errbox{padding:10px 14px;border-radius:var(--r-xs);background:rgba(255,92,138,.1);border:1px solid rgba(255,92,138,.3);color:var(--pink);font-size:13px}
  .note{font-size:12px;line-height:1.55;border:1px solid rgba(52,210,123,.3);background:rgba(52,210,123,.07);border-radius:12px;padding:10px 12px;color:var(--tx2)}
  .or{display:flex;align-items:center;gap:12px;font-size:11px;color:var(--tx3)}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
  @media(max-width:480px){.login{padding:24px 20px}}
</style>
</head>
<body>
<div class="orb" style="width:340px;height:340px;background:rgba(91,140,255,.2);left:-80px;top:100px"></div>
<div class="orb" style="width:280px;height:280px;background:rgba(255,92,138,.16);right:-60px;bottom:80px;animation-delay:-4s"></div>

<main class="wrap">
  <header class="rise" style="--i:0;display:flex;justify-content:center;margin-bottom:22px">
    <div class="brand" style="font-size:18px"><div class="brand-mark" style="width:44px;height:44px;border-radius:14px;font-size:20px">🎯</div><div>Loot-Game <span class="muted" style="font-weight:500">Admin</span></div></div>
  </header>

  <section class="card login rise" style="--i:1">
    <div>
      <div class="lbl">Admin-Login</div>
      <div class="muted" style="font-size:14px;margin-top:6px">Nur für Moderatoren und den Streamer.</div>
    </div>

    <div id="passkeyBox" class="hidden" style="display:flex;flex-direction:column;gap:12px">
      <div id="passkeyNotice" class="note"></div>
      <button id="passkeyBtn" type="button" class="btn primary block xl">🔐 Mit Windows Hello anmelden</button>
      <div id="passkeyErr" class="errbox hidden"></div>
      <div class="or" id="pwDividerLabel">oder mit Passwort</div>
    </div>
    <style>#passkeyBox.hidden{display:none!important}</style>

    <div id="errorMsg" class="errbox hidden"></div>
    <label>Benutzername<input id="username" class="input" type="text" placeholder="Benutzername" autocomplete="username"></label>
    <label>Passwort<input id="password" class="input" type="password" placeholder="Passwort" autocomplete="current-password"></label>
    <button id="loginBtn" type="button" class="btn block xl" onclick="doLogin()">Anmelden</button>
  </section>

  <p class="dim mono rise" style="--i:2;font-size:11px;text-align:center;margin-top:22px">
    <a href="/player-login.html" style="text-decoration:underline">← Zum Spieler-Login</a> · lootgamebot.de
  </p>
</main>

<script>
  // Schon angemeldet? Direkt weiter zum Dashboard.
  (function () {
    var token = null;
    try { token = localStorage.getItem('lootgame_session_token'); } catch (e) {}
    if (!token) return;
    fetch('/api/auth/me', { headers: { 'x-session-token': token } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { if (d && !d.limited) window.location.href = '/admin.html'; })
      .catch(function () {});
  })();

  function showError(msg) {
    var el = document.getElementById('errorMsg');
    el.textContent = msg || '';
    el.classList.toggle('hidden', !msg);
  }

  async function doLogin() {
    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value;
    var btn = document.getElementById('loginBtn');
    if (!username || !password) { showError('Benutzername und Passwort erforderlich.'); return; }
    showError('');
    btn.disabled = true; btn.textContent = 'Einloggen…';
    try {
      var res  = await fetch('/api/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password })
      });
      var data = await res.json();
      if (!res.ok || !data.token) {
        showError(data.error || 'Login fehlgeschlagen.');
        btn.disabled = false; btn.textContent = 'Anmelden';
        return;
      }
      localStorage.setItem('lootgame_session_token', data.token);
      localStorage.setItem('lootgame_username', data.username || username);
      // Passkey-Pflicht aktiv, aber noch keiner eingerichtet: nur die Einrichtungsseite ist erreichbar
      window.location.href = data.passkeySetupRequired ? '/passkey-setup.html' : '/admin.html';
    } catch (e) {
      showError('Server nicht erreichbar — bitte erneut versuchen.');
      btn.disabled = false; btn.textContent = 'Anmelden';
    }
  }

  document.addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
