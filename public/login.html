<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Loot-Game Hub — Login</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#10b981;--green2:rgba(16,185,129,0.12);--green3:rgba(16,185,129,0.25);--red:#f87171;--text:#c8cdd2;--text2:#4a5260;--text3:#2a3240;--bg:#070809;--bg1:#0d0e0f;--border:#1a1c1e;--border2:#252729}
html,body{height:100%;background:var(--bg);font-family:'Rajdhani',sans-serif}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;position:relative;overflow:hidden}

.bg-grid{position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:40px 40px;opacity:0.4}
.bg-glow{position:fixed;top:20%;left:50%;transform:translateX(-50%);width:600px;height:300px;background:rgba(16,185,129,0.03);border-radius:50%;pointer-events:none}
.scanline{position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px);pointer-events:none;z-index:0}

.card{position:relative;z-index:1;width:400px}

.logo-area{text-align:center;margin-bottom:28px}
.logo-wrap{position:relative;display:inline-block;margin-bottom:16px}
.logo-outer{position:absolute;inset:-8px;border:1px solid rgba(16,185,129,0.08)}
.logo-inner{position:absolute;inset:-4px;border:1px solid rgba(16,185,129,0.12)}
.logo-mark{width:56px;height:56px;background:#0a120e;border:1px solid var(--green3);display:flex;align-items:center;justify-content:center;position:relative}
.logo-mark svg{width:24px;height:24px;stroke:var(--green);fill:none;stroke-width:1.5}
.logo-title{font-size:28px;font-weight:700;color:#f0ede8;letter-spacing:0.1em;text-transform:uppercase;line-height:1;margin-bottom:5px}
.logo-sub{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--green);letter-spacing:0.25em;text-transform:uppercase}

.form-box{background:var(--bg1);border:1px solid var(--border);padding:28px;position:relative}
.form-box::before{content:'';position:absolute;top:0;left:20%;right:20%;height:1px;background:linear-gradient(90deg,transparent,rgba(16,185,129,0.35),transparent)}
.corner{position:absolute;width:12px;height:12px;border-color:var(--green3);border-style:solid}
.c-tl{top:-1px;left:-1px;border-width:1px 0 0 1px}
.c-tr{top:-1px;right:-1px;border-width:1px 1px 0 0}
.c-bl{bottom:-1px;left:-1px;border-width:0 0 1px 1px}
.c-br{bottom:-1px;right:-1px;border-width:0 1px 1px 0}

.restricted{background:rgba(248,113,113,0.05);border:1px solid rgba(248,113,113,0.15);padding:7px 12px;margin-bottom:22px;display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--red);letter-spacing:0.1em}
.r-dot{width:5px;height:5px;border-radius:50%;background:var(--red);flex-shrink:0}

.field{margin-bottom:14px}
.field-label{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text3);letter-spacing:0.15em;text-transform:uppercase;margin-bottom:6px;display:block}
.field-wrap{position:relative}
.field-inp{width:100%;background:#050607;border:1px solid var(--border);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px;padding:10px 36px 10px 12px;outline:none;transition:border-color 0.2s}
.field-inp:focus{border-color:rgba(16,185,129,0.35)}
.field-inp::placeholder{color:var(--text3)}
.field-icon{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--text3)}
.field-icon svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5}

.submit-btn{width:100%;background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);color:var(--green);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.2em;padding:12px;cursor:pointer;text-transform:uppercase;margin-top:6px;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px}
.submit-btn:hover{background:rgba(16,185,129,0.18);border-color:rgba(16,185,129,0.5)}
.submit-btn:active{transform:scale(0.99)}
.submit-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

.error{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--red);text-align:center;margin-top:10px;min-height:14px}

.footer{margin-top:20px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text3);letter-spacing:0.1em}

.dots{display:flex;justify-content:center;gap:5px;margin:14px 0}
.dot{width:4px;height:4px;border-radius:50%;background:var(--border2)}
.dot.on{background:var(--green)}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="scanline"></div>

<div class="card">
  <div class="logo-area">
    <div class="logo-wrap">
      <div class="logo-outer"></div>
      <div class="logo-inner"></div>
      <div class="logo-mark">
        <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      </div>
    </div>
    <div class="logo-title">Loot-Game Hub</div>
    <div class="logo-sub">// Control Center · by Coregenetic</div>
  </div>

  <div class="form-box">
    <div class="corner c-tl"></div><div class="corner c-tr"></div>
    <div class="corner c-bl"></div><div class="corner c-br"></div>

    <div class="restricted">
      <div class="r-dot"></div>
      RESTRICTED ACCESS · AUTHORIZED PERSONNEL ONLY
    </div>

    <div class="field">
      <label class="field-label">Benutzername</label>
      <div class="field-wrap">
        <input class="field-inp" id="username" type="text" placeholder="z.B. coregenetic" autocomplete="username">
        <div class="field-icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
      </div>
    </div>

    <div class="field">
      <label class="field-label">Passwort</label>
      <div class="field-wrap">
        <input class="field-inp" id="password" type="password" placeholder="••••••••" autocomplete="current-password">
        <div class="field-icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></div>
      </div>
    </div>

    <button class="submit-btn" id="loginBtn" onclick="doLogin()">
      <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      SYSTEM INITIALISIEREN
    </button>

    <div class="error" id="errorMsg"></div>
  </div>

  <div class="dots"><div class="dot on"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="footer">LOOT-GAME HUB v2.0 · by Coregenetic</div>
</div>

<script>
  const token = localStorage.getItem('lootgame_session_token');
  if (token) {
    fetch('/api/auth/me', {headers:{'x-session-token':token}})
      .then(r => r.ok ? window.location.href = '/index.html' : null)
      .catch(()=>{});
  }

  document.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

  async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errorEl  = document.getElementById('errorMsg');
    const btn      = document.getElementById('loginBtn');

    if (!username || !password) { errorEl.textContent = '⚠ Alle Felder ausfüllen'; return; }

    btn.disabled = true;
    btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg> VERBINDE...';
    errorEl.textContent = '';

    try {
      const res  = await fetch('/api/auth/login', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
      const data = await res.json();
      if (data.success) {
        localStorage.setItem('lootgame_session_token', data.token);
        localStorage.setItem('lootgame_username', data.username);
        window.location.href = '/index.html';
      } else {
        errorEl.textContent = '✗ ' + (data.error || 'Login fehlgeschlagen');
        btn.disabled = false;
        btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> SYSTEM INITIALISIEREN';
      }
    } catch {
      errorEl.textContent = '✗ Server nicht erreichbar';
      btn.disabled = false;
      btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> SYSTEM INITIALISIEREN';
    }
  }
</script>
</body>
</html>
