<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loot-Game Hub — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'sans-serif'],
          mono: ['JetBrains Mono', 'monospace'],
        },
        colors: {
          slate: { 850: '#141c27', 950: '#0a0f16' }
        }
      }
    }
  }
</script>
<style>
  /* Base Adjustments */
  body { background-color: #05080c; color: #e2e8f0; overflow: hidden; }
  
  /* Animated background grid */
  .bg-grid {
    position: fixed; inset: 0; z-index: -1;
    background-image: 
      linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 50px 50px;
    mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
    -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
  }

  /* Glassmorphism utility */
  .glass-card { 
    background: rgba(15, 23, 42, 0.5); 
    backdrop-filter: blur(20px); 
    -webkit-backdrop-filter: blur(20px); 
  }

  /* Loading Spinner animation */
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .animate-spin-slow { animation: spin 2s linear infinite; }
</style>
</head>
<body class="flex items-center justify-center min-h-screen selection:bg-emerald-500/30">

<div class="bg-grid pointer-events-none"></div>

<!-- Ambient Glow Orbs -->
<div class="fixed top-0 left-0 w-full h-full overflow-hidden z-[-1] pointer-events-none">
  <div class="absolute top-[20%] left-[20%] w-[40%] h-[40%] bg-emerald-900/20 blur-[120px] rounded-full"></div>
  <div class="absolute bottom-[20%] right-[20%] w-[40%] h-[40%] bg-blue-900/10 blur-[120px] rounded-full"></div>
</div>

<main class="w-full max-w-md px-6 relative z-10">
  
  <!-- Logo Header -->
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 mb-4 text-emerald-400 relative group">
      <div class="absolute inset-0 bg-emerald-500/20 rounded-2xl blur-md opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
      <svg class="w-8 h-8 relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    </div>
    <h1 class="text-2xl font-bold text-white tracking-widest uppercase">Loot-Game Hub</h1>
    <p class="text-[10px] font-mono text-emerald-500 tracking-[0.2em] uppercase mt-2">// Control Center</p>
  </div>

  <!-- Login Card -->
  <div class="glass-card border border-slate-700/50 rounded-3xl p-8 shadow-2xl relative overflow-hidden">
    <!-- Highlight Line -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-1/2 h-[1px] bg-gradient-to-r from-transparent via-emerald-500/50 to-transparent"></div>

    <div class="flex items-center gap-3 bg-rose-500/5 border border-rose-500/10 rounded-xl p-3 mb-6">
      <div class="w-2 h-2 rounded-full bg-rose-500 animate-pulse shrink-0"></div>
      <p class="text-[10px] font-mono text-rose-400 tracking-widest uppercase">Restricted Access · Authorized Only</p>
    </div>

    <div class="space-y-5">
      <div>
        <label class="block text-[10px] font-mono text-slate-400 uppercase tracking-widest mb-2 ml-1">Benutzername</label>
        <div class="relative">
          <svg class="w-4 h-4 text-slate-500 absolute left-4 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          <input type="text" id="username" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl py-3 pl-11 pr-4 text-sm text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all font-mono" placeholder="z.B. coregenetic" autocomplete="username">
        </div>
      </div>

      <div>
        <label class="block text-[10px] font-mono text-slate-400 uppercase tracking-widest mb-2 ml-1">Passwort</label>
        <div class="relative">
          <svg class="w-4 h-4 text-slate-500 absolute left-4 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" stroke-width="2"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11V7a5 5 0 0110 0v4"/></svg>
          <input type="password" id="password" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl py-3 pl-11 pr-4 text-sm text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all font-mono tracking-widest" placeholder="••••••••" autocomplete="current-password">
        </div>
      </div>

      <div id="errorMsg" class="text-[10px] font-mono text-rose-400 text-center min-h-[16px]"></div>

      <button id="loginBtn" onclick="doLogin()" class="w-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 hover:bg-emerald-500/20 py-3.5 rounded-xl font-mono text-[11px] font-bold tracking-widest uppercase transition-all duration-300 flex items-center justify-center gap-3">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg>
        <span>System Initialisieren</span>
      </button>
    </div>
  </div>

  <div class="text-center mt-8 space-y-3">
    <div class="flex justify-center gap-1.5">
      <div class="w-1.5 h-1.5 rounded-full bg-emerald-500 shadow-[0_0_5px_#10b981]"></div>
      <div class="w-1.5 h-1.5 rounded-full bg-slate-700"></div>
      <div class="w-1.5 h-1.5 rounded-full bg-slate-700"></div>
    </div>
    <div class="text-[9px] font-mono text-slate-500 tracking-widest">
      LOOT-GAME HUB v2.0 · BY COREGENETIC
    </div>
  </div>

</main>

<script>
  // Check if already logged in via token
  const token = localStorage.getItem('lootgame_session_token');
  if (token) {
    fetch('/api/auth/me', {headers:{'x-session-token':token}})
      .then(r => r.ok ? window.location.href = '/index.html' : null)
      .catch(()=>{});
  }

  // Handle Enter Key
  document.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

  async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errorEl  = document.getElementById('errorMsg');
    const btn      = document.getElementById('loginBtn');

    if (!username || !password) { 
      errorEl.textContent = '⚠ Alle Felder ausfüllen'; 
      return; 
    }

    // Loading State
    btn.disabled = true;
    btn.innerHTML = `
      <svg class="w-4 h-4 animate-spin-slow" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      <span>Verbinde...</span>
    `;
    btn.classList.replace('text-emerald-400', 'text-slate-400');
    btn.classList.replace('border-emerald-500/30', 'border-slate-700');
    btn.classList.replace('bg-emerald-500/10', 'bg-slate-800/50');
    errorEl.textContent = '';

    try {
      const res  = await fetch('/api/auth/login', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({username,password})
      });
      const data = await res.json();
      
      if (data.success) {
        localStorage.setItem('lootgame_session_token', data.token);
        localStorage.setItem('lootgame_username', data.username);
        
        // Success State (briefly show before redirect)
        btn.innerHTML = `
          <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
          <span class="text-emerald-400">Verbunden</span>
        `;
        setTimeout(() => window.location.href = '/index.html', 300);

      } else {
        errorEl.textContent = '✗ ' + (data.error || 'Login fehlgeschlagen');
        resetBtnState(btn);
      }
    } catch {
      errorEl.textContent = '✗ Server nicht erreichbar';
      resetBtnState(btn);
    }
  }

  function resetBtnState(btn) {
    btn.disabled = false;
    btn.innerHTML = `
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg>
      <span>System Initialisieren</span>
    `;
    btn.classList.replace('text-slate-400', 'text-emerald-400');
    btn.classList.replace('border-slate-700', 'border-emerald-500/30');
    btn.classList.replace('bg-slate-800/50', 'bg-emerald-500/10');
  }
</script>
</body>
</html>
