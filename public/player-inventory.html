<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mein Inventar — Loot-Game Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="player-api.js"></script>
<style>
  body { background-color: #05080c; color: #e2e8f0; font-family: 'Inter', sans-serif; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
  .glass-card { background: rgba(15,23,42,0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .cat-pill { font-size: 11px; padding: 4px 10px; border-radius: 8px; border: 1px solid #334155; color: #94a3b8; cursor: pointer; transition: all .15s; }
  .cat-pill:hover { border-color: #475569; color: #cbd5e1; }
  .cat-pill.on { border-color: #10b981; color: #10b981; background: rgba(16,185,129,0.1); }
</style>
</head>
<body class="min-h-screen pb-10">

<header class="border-b border-slate-800/60 px-4 md:px-6 py-3 flex items-center justify-between">
  <a href="player-hub.html" class="text-xs font-mono text-slate-400 hover:text-emerald-400 transition-colors flex items-center gap-1.5">
    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
    Player Hub
  </a>
  <span class="text-xs font-semibold tracking-wide text-white uppercase">Mein Inventar</span>
</header>

<main class="max-w-2xl mx-auto p-4 md:p-6 space-y-4">

  <div id="loadingState" class="text-center py-20 text-slate-500 text-sm font-mono">Lade Inventar...</div>
  <div id="errorState" class="hidden text-center py-20"><p class="text-rose-400 text-sm" id="errorMsg"></p></div>

  <div id="invContent" class="hidden space-y-4">
    <div class="flex items-center justify-between">
      <div class="relative flex-1 mr-3">
        <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="text" id="filterInput" placeholder="Item suchen..." class="w-full bg-slate-900/50 border border-slate-700 rounded-xl pl-9 pr-3 py-2 text-sm text-white focus:border-emerald-500 outline-none">
      </div>
      <span class="text-[11px] font-mono text-slate-500 whitespace-nowrap" id="itemCount">— Items</span>
    </div>

    <div class="flex items-center justify-between bg-emerald-500/5 border border-emerald-500/20 rounded-xl px-3 py-2">
      <span class="text-xs text-slate-400">💰 Bargeld</span>
      <span class="text-sm font-mono font-semibold text-emerald-400" id="balanceDisplay">—</span>
    </div>

    <div class="flex items-center justify-between flex-wrap gap-2">
      <div class="flex gap-1.5 flex-wrap" id="catFilters">
        <span class="cat-pill on" data-cat="all">Alle</span>
        <span class="cat-pill" data-cat="weapons">Weapons</span>
        <span class="cat-pill" data-cat="gear">Gear</span>
        <span class="cat-pill" data-cat="valuables">Valuables</span>
        <span class="cat-pill" data-cat="other">Sonstiges</span>
      </div>
      <select id="sortSelect" class="bg-slate-900/50 border border-slate-700 rounded-lg text-xs text-slate-300 px-2 py-1.5 outline-none">
        <option value="price_desc">Preis ↓</option>
        <option value="price_asc">Preis ↑</option>
        <option value="qty_desc">Menge ↓</option>
        <option value="qty_asc">Menge ↑</option>
      </select>
    </div>

    <div class="glass-card border border-slate-700/50 rounded-2xl p-2">
      <div id="invList" class="space-y-1.5 max-h-[60vh] overflow-y-auto pr-1"></div>
    </div>
  </div>
</main>

<script>
  let allItems = [];
  let curCat = 'all';
  let playerBalance = 0;

  function formatVal(v) {
    if (!v) return '0 ₽';
    if (v >= 1e9) return (v/1e9).toFixed(2) + 'B ₽';
    if (v >= 1e6) return (v/1e6).toFixed(2) + 'M ₽';
    if (v >= 1e3) return (v/1e3).toFixed(0) + 'K ₽';
    return v + ' ₽';
  }

  const FALLBACK_ICON = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjNGI1NTYzIiBzdHJva2Utd2lkdGg9IjIiPjxwYXRoIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIgZD0iTTIwIDdsLTgtNC04IDRtMTYgMGwtOCA0bTgtNHYxMGwtOCA0bTAtMTBMNCA3bTggNHYxME00IDd2MTBsOCA0Ii8+PC9zdmc+';

  function render() {
    const filterText = document.getElementById('filterInput').value.toLowerCase();
    const sortMode = document.getElementById('sortSelect').value;

    let items = allItems.filter(i => curCat === 'all' || i.category === curCat);
    items = items.filter(i => i.item_name.toLowerCase().includes(filterText));

    if (sortMode === 'price_desc') items.sort((a,b) => (b.value*b.count) - (a.value*a.count));
    if (sortMode === 'price_asc')  items.sort((a,b) => (a.value*a.count) - (b.value*b.count));
    if (sortMode === 'qty_desc')   items.sort((a,b) => b.count - a.count);
    if (sortMode === 'qty_asc')    items.sort((a,b) => a.count - b.count);

    document.getElementById('itemCount').textContent = allItems.length + ' Items';
    document.getElementById('balanceDisplay').textContent = formatVal(playerBalance);

    const listEl = document.getElementById('invList');
    if (!items.length) {
      listEl.innerHTML = '<p class="text-xs font-mono text-slate-600 p-4 text-center">Keine Items gefunden</p>';
      return;
    }

    listEl.innerHTML = items.map(function(item) {
      const total = item.value * item.count;
      const icon = item.icon || FALLBACK_ICON;
      const safeName = item.item_name.replace(/'/g, "\'");

      return '<div class="px-3 py-2.5 rounded-xl bg-slate-900/30 border-l-[3px] border-slate-600 hover:bg-slate-800/30 transition-colors">' +
          '<div class="flex items-center justify-between">' +
            '<div class="flex items-center gap-3 min-w-0">' +
              '<div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 bg-white/[0.04] overflow-hidden">' +
                '<img src="' + icon + '" alt="" class="w-6 h-6 object-contain" onerror="this.src=\'' + FALLBACK_ICON + '\'">' +
              '</div>' +
              '<div class="min-w-0">' +
                '<span class="text-sm text-slate-200 truncate block">' + item.item_name + '</span>' +
                '<span class="text-xs font-mono text-slate-500 tabular-nums">' + item.count + 'x</span>' +
              '</div>' +
            '</div>' +
            '<div class="flex items-center gap-3 flex-shrink-0 ml-2">' +
              '<div class="text-right">' +
                '<div class="text-sm font-mono font-semibold text-amber-400 tabular-nums">' + formatVal(total) + '</div>' +
                '<div class="text-xs font-mono text-slate-600 tabular-nums">' + formatVal(item.value) + '/Stk</div>' +
              '</div>' +
              '<button onclick="openSellModal(\'' + safeName + '\', ' + item.count + ', ' + item.value + ', \'' + icon + '\')" style="padding:6px 12px;border-radius:8px;background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.2);color:#f87171;font-size:11px;font-family:JetBrains Mono,monospace;cursor:pointer;">Verkaufen</button>' +
            '</div>' +
          '</div>' +
        '</div>';
    }).join('');
  }

  let _modalItem = null;
  let _modalValue = 0;

  function formatVal(v) {
    if (!v) return '0 ₽';
    if (v >= 1e9) return (v/1e9).toFixed(2) + 'B ₽';
    if (v >= 1e6) return (v/1e6).toFixed(2) + 'M ₽';
    if (v >= 1e3) return (v/1e3).toFixed(0) + 'K ₽';
    return v + ' ₽';
  }

  function openSellModal(name, maxCount, value, icon) {
    _modalItem = name; _modalValue = value;
    document.getElementById('modalItemName').textContent = name;
    document.getElementById('modalItemValue').textContent = maxCount + 'x verfügbar · ' + formatVal(value) + '/Stk';
    document.getElementById('modalIcon').src = icon;
    document.getElementById('modalQty').max = maxCount;
    document.getElementById('modalQty').value = 1;
    document.getElementById('modalError').textContent = '';
    updateModalEarned();
    const modal = document.getElementById('sellModal');
    modal.style.display = 'flex';
  }

  function closeSellModal() {
    document.getElementById('sellModal').style.display = 'none';
    _modalItem = null;
  }

  function modalQtyChange(delta) {
    const input = document.getElementById('modalQty');
    const newVal = Math.max(1, Math.min(parseInt(input.max), parseInt(input.value || 1) + delta));
    input.value = newVal;
    updateModalEarned();
  }

  function modalQtyMax() {
    const input = document.getElementById('modalQty');
    input.value = input.max;
    updateModalEarned();
  }

  function updateModalEarned() {
    const qty = parseInt(document.getElementById('modalQty').value || 1);
    const rate = 0.8; // wird später vom Server geholt
    const earned = Math.round(_modalValue * qty * rate);
    document.getElementById('modalEarned').textContent = formatVal(earned);
    document.getElementById('modalRateInfo').textContent = qty + 'x · ' + Math.round(rate * 100) + '% Verkaufsrate';
  }

  async function confirmSellModal() {
    const qty = parseInt(document.getElementById('modalQty').value || 1);
    const errEl = document.getElementById('modalError');
    try {
      const r = await PlayerAPI.sellItem(_modalItem, qty);
      playerBalance = r.newBalance;
      closeSellModal();
      await loadInventory();
    } catch(e) {
      errEl.textContent = e.message;
    }
  }

  // Klick außerhalb schließt Modal
  document.getElementById('sellModal').addEventListener('click', function(e) {
    if (e.target === this) closeSellModal();
  });

  async function loadInventory() {
    try {
      const data = await PlayerAPI.myInventory();
      allItems = data.inventory;
      playerBalance = data.balance || 0;
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('invContent').classList.remove('hidden');
      render();
    } catch (err) {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('errorState').classList.remove('hidden');
      document.getElementById('errorMsg').textContent = err.message;
    }
  }

  document.getElementById('filterInput').addEventListener('input', render);
  document.getElementById('sortSelect').addEventListener('change', render);
  document.querySelectorAll('.cat-pill').forEach(function(p) {
    p.addEventListener('click', function() {
      document.querySelectorAll('.cat-pill').forEach(function(x) { x.classList.remove('on'); });
      p.classList.add('on');
      curCat = p.dataset.cat;
      render();
    });
  });

  if (!PlayerAPI.isLoggedIn()) {
    window.location.href = '/player-login.html';
  } else {
    loadInventory();
  }
</script>

<!-- Verkaufs-Modal -->
<div id="sellModal" style="display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);align-items:center;justify-content:center;">
  <div style="background:#0a0f18;border:1px solid rgba(16,185,129,0.2);border-radius:20px;padding:28px 24px;width:90%;max-width:360px;box-shadow:0 0 60px rgba(16,185,129,0.08);">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
      <img id="modalIcon" src="" alt="" style="width:40px;height:40px;object-fit:contain;background:rgba(255,255,255,0.04);border-radius:10px;padding:6px;">
      <div>
        <div id="modalItemName" style="font-size:14px;font-weight:600;color:#e2e8f0;"></div>
        <div id="modalItemValue" style="font-size:11px;font-family:'JetBrains Mono',monospace;color:#64748b;margin-top:2px;"></div>
      </div>
    </div>
    <div style="margin-bottom:18px;">
      <label style="font-size:11px;font-family:'JetBrains Mono',monospace;color:#64748b;text-transform:uppercase;letter-spacing:0.06em;display:block;margin-bottom:8px;">Menge</label>
      <div style="display:flex;align-items:center;gap:10px;">
        <button onclick="modalQtyChange(-1)" style="width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:#94a3b8;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;">−</button>
        <input type="number" id="modalQty" min="1" value="1" style="flex:1;background:rgba(15,23,42,0.8);border:1px solid rgba(255,255,255,0.08);border-radius:9px;padding:8px 12px;color:#e2e8f0;font-size:15px;font-family:'JetBrains Mono',monospace;text-align:center;outline:none;" oninput="updateModalEarned()">
        <button onclick="modalQtyChange(1)" style="width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:#94a3b8;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;">+</button>
        <button id="modalMaxBtn" onclick="modalQtyMax()" style="padding:0 12px;height:36px;border-radius:9px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:#64748b;font-size:11px;font-family:'JetBrains Mono',monospace;cursor:pointer;">MAX</button>
      </div>
    </div>
    <div style="background:rgba(16,185,129,0.05);border:1px solid rgba(16,185,129,0.15);border-radius:12px;padding:14px 16px;margin-bottom:18px;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <span style="font-size:11px;color:#64748b;">Du erhältst</span>
        <span id="modalEarned" style="font-size:18px;font-weight:700;font-family:'JetBrains Mono',monospace;color:#10b981;">—</span>
      </div>
      <div id="modalRateInfo" style="font-size:10px;font-family:'JetBrains Mono',monospace;color:#334155;margin-top:4px;text-align:right;"></div>
    </div>
    <div style="display:flex;gap:10px;">
      <button onclick="closeSellModal()" style="flex:1;padding:11px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);color:#64748b;font-size:13px;font-weight:600;cursor:pointer;">Abbrechen</button>
      <button onclick="confirmSellModal()" style="flex:1;padding:11px;border-radius:10px;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.3);color:#10b981;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 0 16px rgba(16,185,129,0.1);">Verkaufen ✓</button>
    </div>
    <div id="modalError" style="font-size:11px;color:#f87171;text-align:center;margin-top:10px;min-height:14px;font-family:'JetBrains Mono',monospace;"></div>
  </div>
</div>

</body>
</html>
