<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mein Inventar — Loot-Game Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css">
<link rel="stylesheet" href="css/hub-ui.css">
<script src="player-api.js"></script>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand"><div class="brand-mark">🎒</div><div>Inventar<small>Loot-Game Hub</small></div></div>
    <nav class="tabnav"><a href="player-hub.html">Hub</a><a href="player-inventory.html" class="on">Inventar</a><a href="player-leaderboard.html">Rangliste</a><a href="player-squad.html">Squad</a></nav>
    <button class="btn sm" onclick="PlayerAPI.logout()"><i class="ti ti-logout"></i>Abmelden</button>
  </div>

  <div id="loadingState" class="state"><div class="spinner"></div>Lade Inventar...</div>
  <div id="errorState" class="hidden state"><p class="t-pink" id="errorMsg"></p></div>

  <div id="invContent" class="hidden stack">

    <div class="card rise" style="--i:0">
      <div class="row between">
        <div>
          <div class="lbl">💰 Bargeld</div>
          <div class="big t-green num" style="margin-top:6px" id="balanceDisplay">—</div>
        </div>
        <span class="pill num" id="itemCount">— Items</span>
      </div>
    </div>

    <div class="toolbar">
    <div class="rise tb-search" style="--i:1">
      <div class="field">
        <i class="ti ti-search"></i>
        <input type="text" id="filterInput" placeholder="Item suchen..." class="input" autocomplete="off">
      </div>
    </div>

    <div class="row rise" style="--i:2">
      <div class="seg grow" id="catFilters">
        <span class="cat-pill on" data-cat="all">Alle</span>
        <span class="cat-pill" data-cat="weapons">Weapons</span>
        <span class="cat-pill" data-cat="gear">Gear</span>
        <span class="cat-pill" data-cat="valuables">Valuables</span>
        <span class="cat-pill" data-cat="other">Sonstiges</span>
      </div>
      <select id="sortSelect" class="input" style="width:auto;padding-top:9px;padding-bottom:9px">
        <option value="price_desc">Preis ↓</option>
        <option value="price_asc">Preis ↑</option>
        <option value="qty_desc">Menge ↓</option>
        <option value="qty_asc">Menge ↑</option>
      </select>
    </div>
    </div>

    <div id="invList" class="stack" style="gap:10px"></div>
  </div>
</div>

<nav class="dock">
  <a href="player-hub.html"><i class="ti ti-home-2"></i><span>Hub</span></a>
  <a href="player-inventory.html" class="on"><i class="ti ti-backpack"></i><span>Inventar</span></a>
  <a href="player-leaderboard.html"><i class="ti ti-trophy"></i><span>Rangliste</span></a>
  <a href="player-squad.html"><i class="ti ti-users"></i><span>Squad</span></a>
</nav>

<!-- Verkaufs-Modal -->
<div id="sellModal" class="overlay">
  <div class="sheet">
    <div class="row" style="margin-bottom:20px">
      <div class="item" style="padding:0;border:0;background:none;cursor:default;pointer-events:none"><div class="ico" style="width:52px;height:52px"><img id="modalIcon" src="" alt=""></div></div>
      <div class="grow">
        <div id="modalItemName" class="h2" style="overflow:hidden;text-overflow:ellipsis"></div>
        <div id="modalItemValue" class="mono dim" style="font-size:11px;margin-top:3px"></div>
      </div>
    </div>

    <div class="lbl" style="margin-bottom:8px">Menge</div>
    <div class="row" style="gap:8px;margin-bottom:18px">
      <button class="btn" style="width:42px;padding:10px 0;font-size:18px" onclick="modalQtyChange(-1)">−</button>
      <input type="number" id="modalQty" min="1" value="1" class="input mono" style="text-align:center" oninput="updateModalEarned()">
      <button class="btn" style="width:42px;padding:10px 0;font-size:18px" onclick="modalQtyChange(1)">+</button>
      <button class="btn sm" id="modalMaxBtn" onclick="modalQtyMax()">MAX</button>
    </div>

    <div class="card sm" style="background:rgba(52,210,123,.07);border-color:rgba(52,210,123,.22);margin-bottom:18px">
      <div class="row between">
        <span class="muted" style="font-size:13px">Du erhältst</span>
        <span id="modalEarned" class="mono t-green num" style="font-size:20px;font-weight:700">—</span>
      </div>
      <div id="modalRateInfo" class="mono dim" style="font-size:11px;margin-top:4px;text-align:right"></div>
    </div>

    <div class="row">
      <button class="btn grow" onclick="closeSellModal()">Abbrechen</button>
      <button class="btn primary grow" onclick="confirmSellModal()">Verkaufen ✓</button>
    </div>
    <div id="modalError" class="t-pink mono" style="font-size:12px;text-align:center;margin-top:12px;min-height:16px"></div>
  </div>
</div>

<script>
  let allItems = [];
  let shownItems = [];
  let curCat = 'all';
  let playerBalance = 0;

  function formatVal(v) {
    if (!v) return '0 ₽';
    if (v >= 1e9) return (v/1e9).toFixed(2) + 'B ₽';
    if (v >= 1e6) return (v/1e6).toFixed(2) + 'M ₽';
    if (v >= 1e3) return (v/1e3).toFixed(0) + 'K ₽';
    return v + ' ₽';
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
  }

  const FALLBACK_ICON = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjNGI1NTYzIiBzdHJva2Utd2lkdGg9IjIiPjxwYXRoIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIgZD0iTTIwIDdsLTgtNC04IDRtMTYgMGwtOCA0bTgtNHYxMGwtOCA0bTAtMTBMNCA3bTggNHYxME00IDd2MTBsOCA0Ii8+PC9zdmc+';

  function render() {
    const filterText = document.getElementById('filterInput').value.toLowerCase();
    const sortMode = document.getElementById('sortSelect').value;

    let items = allItems.filter(i => curCat === 'all' || i.category === curCat);
    items = items.filter(i => i.item_name.toLowerCase().includes(filterText));

    if (sortMode === 'price_desc') items.sort((a,b) => (b.value*b.count) - (a.value*a.count));
    if (sortMode === 'price_asc')  items.sort((a,b) => (a.value*a.count) - (b.value*b.count));
    if (sortMode === 'qty_desc')   items.sort((a,b) => b.count - a.count);
    if (sortMode === 'qty_asc')    items.sort((a,b) => a.count - b.count);
    shownItems = items;

    document.getElementById('itemCount').textContent = allItems.length + ' Items';
    document.getElementById('balanceDisplay').textContent = formatVal(playerBalance);

    const listEl = document.getElementById('invList');
    if (!items.length) {
      listEl.innerHTML = '<p class="empty" style="text-align:center">Keine Items gefunden</p>';
      return;
    }

    listEl.innerHTML = items.map(function(item, idx) {
      const total = item.value * item.count;
      const icon = item.icon || FALLBACK_ICON;
      return '<div class="item" onclick="openSellByIndex(' + idx + ')">' +
          '<div class="ico"><img src="' + esc(icon) + '" alt="" onerror="this.onerror=null;this.src=\'' + FALLBACK_ICON + '\'"></div>' +
          '<div class="grow">' +
            '<div style="font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(item.item_name) + '</div>' +
            '<div class="dim mono num" style="font-size:12px;margin-top:2px">' + item.count + 'x · ' + formatVal(item.value) + '/Stk</div>' +
          '</div>' +
          '<div style="text-align:right;flex:none">' +
            '<div class="mono t-gold num" style="font-weight:700;font-size:14px">' + formatVal(total) + '</div>' +
            '<div class="pill pink" style="margin-top:5px;padding:2px 9px;font-size:11px">Verkaufen</div>' +
          '</div>' +
        '</div>';
    }).join('');
  }

  let _modalItem = null;
  let _modalValue = 0;

  function openSellByIndex(idx) {
    const item = shownItems[idx];
    if (!item) return;
    openSellModal(item.item_name, item.count, item.value, item.icon || FALLBACK_ICON);
  }

  function openSellModal(name, maxCount, value, icon) {
    _modalItem = name; _modalValue = value;
    document.getElementById('modalItemName').textContent = name;
    document.getElementById('modalItemValue').textContent = maxCount + 'x verfügbar · ' + formatVal(value) + '/Stk';
    const img = document.getElementById('modalIcon');
    img.onerror = function() { img.onerror = null; img.src = FALLBACK_ICON; };
    img.src = icon;
    document.getElementById('modalQty').max = maxCount;
    document.getElementById('modalQty').value = 1;
    document.getElementById('modalError').textContent = '';
    updateModalEarned();
    document.getElementById('sellModal').classList.add('open');
  }

  function closeSellModal() {
    document.getElementById('sellModal').classList.remove('open');
    _modalItem = null;
  }

  function modalQtyChange(delta) {
    const input = document.getElementById('modalQty');
    const newVal = Math.max(1, Math.min(parseInt(input.max), parseInt(input.value || 1) + delta));
    input.value = newVal;
    updateModalEarned();
  }

  function modalQtyMax() {
    const input = document.getElementById('modalQty');
    input.value = input.max;
    updateModalEarned();
  }

  function updateModalEarned() {
    const qty = parseInt(document.getElementById('modalQty').value || 1);
    const rate = 0.8; // wird später vom Server geholt
    const earned = Math.round(_modalValue * qty * rate);
    document.getElementById('modalEarned').textContent = formatVal(earned);
    document.getElementById('modalRateInfo').textContent = qty + 'x · ' + Math.round(rate * 100) + '% Verkaufsrate';
  }

  async function confirmSellModal() {
    const qty = parseInt(document.getElementById('modalQty').value || 1);
    const errEl = document.getElementById('modalError');
    try {
      const r = await PlayerAPI.sellItem(_modalItem, qty);
      playerBalance = r.newBalance;
      closeSellModal();
      await loadInventory();
    } catch(e) {
      errEl.textContent = e.message;
    }
  }

  // Klick außerhalb schließt Modal — nach DOM-Load
  document.addEventListener('DOMContentLoaded', function() {
    const modal = document.getElementById('sellModal');
    if (modal) modal.addEventListener('click', function(e) {
      if (e.target === this) closeSellModal();
    });
  });
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeSellModal(); });

  async function loadInventory() {
    try {
      const data = await PlayerAPI.myInventory();
      allItems = data.inventory;
      playerBalance = data.balance || 0;
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('invContent').classList.remove('hidden');
      render();
    } catch (err) {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('errorState').classList.remove('hidden');
      document.getElementById('errorMsg').textContent = err.message;
    }
  }

  document.getElementById('filterInput').addEventListener('input', render);
  document.getElementById('sortSelect').addEventListener('change', render);
  document.querySelectorAll('.cat-pill').forEach(function(p) {
    p.addEventListener('click', function() {
      document.querySelectorAll('.cat-pill').forEach(function(x) { x.classList.remove('on'); });
      p.classList.add('on');
      curCat = p.dataset.cat;
      render();
    });
  });

  if (!PlayerAPI.isLoggedIn()) {
    window.location.href = '/player-login.html';
  } else {
    loadInventory();
  }
</script>
</body>
</html>
