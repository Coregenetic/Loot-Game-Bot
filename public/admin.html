<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Loot-Game Hub</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#05080c">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/favicon-32.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'sans-serif'],
          mono: ['JetBrains Mono', 'monospace'],
        },
        colors: {
          slate: { 850: '#141c27', 950: '#0a0f16' }
        }
      }

<style>
  /* Base adjustments & Custom Scrollbars */
  body { background-color: #05080c; color: #e2e8f0; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #334155; }

  /* Animated background grid */
  .bg-grid {
    position: fixed; inset: 0; z-index: -1;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 50px 50px;
    mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
    -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
  }

  /* Glassmorphism utility */
  .glass { background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .glass-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }

  /* Sidebar nav items */
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; color: #94a3b8; font-size: 12.5px; font-weight: 500; transition: all .15s; width: 100%; text-align: left; }
  .nav-item:hover { background: rgba(255,255,255,0.04); color: #e2e8f0; }
  .nav-item.nav-active { background: rgba(16,185,129,0.1); color: #10b981; font-weight: 600; }
  .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* Log Colors injected by JS */
  .log-INFO .log-level-color { color: #64748b; }
  .log-WARN .log-level-color { color: #f59e0b; }
  .log-ERROR .log-level-color { color: #f43f5e; }
  .log-CMD .log-level-color { color: #3b82f6; }
  .log-CMD .log-msg-color { color: #93c5fd; }
  .log-BOT .log-level-color { color: #10b981; }
  .log-BOT .log-msg-color { color: #6ee7b7; }
  .log-API .log-level-color { color: #a855f7; }

  /* Input fields hiding arrows for number types */
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

  @keyframes revealTile {
    0% { opacity: 0; transform: translateY(30px) scale(0.95); filter: blur(4px); }
    100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }
  .animate-reveal {
    opacity: 0;
    animation: revealTile 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
</style>
</head>
<body class="flex h-screen overflow-hidden text-slate-300 selection:bg-emerald-500/30">

<div class="bg-grid pointer-events-none"></div>
<div class="fixed top-0 left-0 w-full h-full overflow-hidden z-[-1] pointer-events-none">
  <div class="absolute top-[-10%] right-[-5%] w-[40%] h-[40%] bg-emerald-900/10 blur-[100px] rounded-full"></div>
  <div class="absolute bottom-[-10%] left-[-5%] w-[40%] h-[40%] bg-blue-900/10 blur-[100px] rounded-full"></div>
</div>

<!-- SIDEBAR (Desktop) -->

    <span class="font-bold text-slate-100 tracking-wider text-xs">LOOT-GAME HUB</span>
  </div>

  <nav class="flex-1 overflow-y-auto p-2.5 space-y-0.5">
    <button onclick="navigateTo('overview')" data-nav="overview" class="nav-item">

    <button onclick="navigateTo('cooldowns')" data-nav="cooldowns" data-permission="cooldowns:manage" class="nav-item">

      Cooldowns

    <button onclick="navigateTo('players')" data-nav="players" data-permission="players:view" class="nav-item">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>

    <button onclick="navigateTo('events')" data-nav="events" data-permission="events:manage" class="nav-item">

      Live Events

    <button onclick="navigateTo('squads')" data-nav="squads" data-permission="players:manage" class="nav-item">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>

    </button>
    <button onclick="navigateTo('users')" data-nav="users" data-permission="superadmin" class="nav-item">

    <button onclick="navigateTo('server')" data-nav="server" data-permission="server:manage" class="nav-item">

      Server

  </nav>

  <div class="border-t border-slate-800/60 p-3 flex items-center justify-between shrink-0">
    <button id="pushBellBtn" onclick="togglePush()" title="Push-Benachrichtigungen" class="relative w-8 h-8 flex items-center justify-center rounded-lg border border-slate-700 text-slate-400 hover:text-emerald-400 hover:border-emerald-500/40 transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>

    <span class="text-[10px] font-mono text-slate-500 truncate px-1" id="sidebarUsername">—</span>
    <button onclick="doLogout()" title="Abmelden" class="w-8 h-8 flex items-center justify-center rounded-lg border border-slate-700 text-slate-400 hover:text-rose-400 hover:border-rose-500/40 transition-colors shrink-0">

    </button>

</aside>

<div class="flex-1 flex flex-col overflow-hidden min-h-0">

  <!-- SLIM TOP STATUS BAR -->

        <span id="botStatusLabel" class="text-slate-200 hidden sm:inline">BOT ONLINE</span>

      <div class="hidden sm:block">UPTIME <span id="uptimeVal" class="text-slate-200 ml-1">—</span></div>
      <div class="hidden sm:block">PING <span id="pingVal" class="text-slate-200 ml-1">—</span></div>

  <!-- MAIN CONTENT -->
