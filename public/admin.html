<style>
  /* Base adjustments & Custom Scrollbars */
  body { background-color: #05080c; color: #e2e8f0; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #334155; }
  
  /* Animated background grid */
  .bg-grid {
    position: fixed; inset: 0; z-index: -1;
    background-image: 
      linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 50px 50px;
    mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
    -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
  }

  /* Glassmorphism utility */
  .glass { background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .glass-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }

  /* Log Colors injected by JS */
  .log-INFO .log-level-color { color: #64748b; }
  .log-WARN .log-level-color { color: #f59e0b; }
  .log-ERROR .log-level-color { color: #f43f5e; }
  .log-CMD .log-level-color { color: #3b82f6; }
  .log-CMD .log-msg-color { color: #93c5fd; }
  .log-BOT .log-level-color { color: #10b981; }
  .log-BOT .log-msg-color { color: #6ee7b7; }
  .log-API .log-level-color { color: #a855f7; }

  /* Input fields hiding arrows for number types */
  input[type="number"]::-webkit-inner-spin-button, 
  input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

  @keyframes revealTile {
    0% { opacity: 0; transform: translateY(30px) scale(0.95); filter: blur(4px); }
    100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }
  .animate-reveal {
    opacity: 0;
    animation: revealTile 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
</style>
</head>

<!-- TOP BAR -->
<header class="glass border-b border-slate-800/80 h-14 flex items-center justify-between px-4 sm:px-6 shrink-0 z-50 shadow-md relative">

    <div class="hidden md:flex items-center gap-4 text-[10px] font-mono text-slate-400">

    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
    ÜBERSICHT
  </button>
  <span class="text-xs font-mono text-slate-600">/</span>

<!-- ========================================== -->
<!-- CUSTOM MODALS (Replaces alert & confirm) -->
<!-- ========================================== -->
<div id="toast-container" class="fixed bottom-4 right-4 z-[999] flex flex-col gap-2 pointer-events-none"></div>

<div id="confirm-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center opacity-0 invisible transition-all duration-300">
  <div class="bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl p-6 w-full max-w-sm scale-95 transition-transform duration-300" id="confirm-modal-content">
    <h3 class="text-lg font-bold text-white mb-2" id="confirm-title">Bestätigen</h3>
    <p class="text-sm text-slate-400 mb-6" id="confirm-msg">Möchtest du diese Aktion wirklich ausführen?</p>

    <div class="flex justify-end gap-3">
      <button onclick="closeConfirm()" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition-colors">Abbrechen</button>
      <button onclick="executeConfirm()" class="px-4 py-2 rounded-xl text-sm font-medium bg-emerald-500 text-slate-950 hover:bg-emerald-400 transition-colors shadow-[0_0_15px_rgba(16,185,129,0.3)]">Bestätigen</button>
    </div>
  </div>
</div>

<!-- Dummy API für UI-Vorschau -->
<script>
  if (typeof LootGameAPI === 'undefined') {
    window.LootGameAPI = {
      isLoggedIn: () => true, getUsername: () => 'Admin', getToken: () => 'dummy-token'
    };
  }
</script>
<script src="api-client.js"></script>

<script>
// ---------- CUSTOM UI HELPER (Modals & Toasts) ----------
let confirmCallback = null;

function showConfirm(title, msg, callback) {
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-msg').textContent = msg;
  confirmCallback = callback;
  const modal = document.getElementById('confirm-modal');
  const content = document.getElementById('confirm-modal-content');
  modal.classList.remove('opacity-0', 'invisible');
  content.classList.remove('scale-95');
}

function closeConfirm() {
  const modal = document.getElementById('confirm-modal');
  const content = document.getElementById('confirm-modal-content');
  modal.classList.add('opacity-0', 'invisible');
  content.classList.add('scale-95');
  confirmCallback = null;
}

function executeConfirm() {
  if(confirmCallback) confirmCallback();
  closeConfirm();
}

function showToast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  const colors = {
    success: 'bg-emerald-500/10 border-emerald-500/50 text-emerald-400',
    error: 'bg-rose-500/10 border-rose-500/50 text-rose-400',
    warning: 'bg-amber-500/10 border-amber-500/50 text-amber-400',
    info: 'bg-blue-500/10 border-blue-500/50 text-blue-400'
  };
  
  toast.className = `glass-card border ${colors[type] || colors.info} px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 text-sm transform transition-all duration-300 translate-y-4 opacity-0`;
  toast.innerHTML = `<div class="font-mono text-xs">${message}</div>`;
  container.appendChild(toast);
  
  requestAnimationFrame(() => toast.classList.remove('translate-y-4', 'opacity-0'));
  setTimeout(() => {
    toast.classList.add('opacity-0', 'translate-x-4');
    setTimeout(() => toast.remove(), 300);
  }, 4000);
}

// Ersetzt showQuickMsg optisch durch Toasts, aber behält Kompatibilität
function showQuickMsg(msg, color) {
  let type = 'info';
  if(color.includes('green')) type = 'success';
  if(color.includes('red')) type = 'error';
  if(color.includes('amber')) type = 'warning';
  showToast(msg, type);
}

// ---------- ORIGINAL LOGIC ----------
if (!LootGameAPI.isLoggedIn()) window.location.href = '/login.html';

let activeTab = 'dashboard';
let logFilter = 'ALL';
let allLogs   = [];
let allCDs    = [];
let logPoll   = null;
let serverPw  = null;

// ─── Aktueller User + Permissions ─────────────────────────────────────────────
let currentUser = { username: '', role: 'mod', permissions: [] };

const TAB_PERMISSIONS = {
  analytics: 'analytics:view',
  logs:      'logs:view',
  cooldowns: 'cooldowns:manage',
  players:   'players:view',
  events:    'events:manage',
  server:    'server:manage',
  users:     'superadmin' // Spezialfall, kein Permission-Key
};

function canAccess(tab) {
  const need = TAB_PERMISSIONS[tab];
  if (!need) return true; // overview ist immer offen
  if (currentUser.role === 'superadmin') return true;
  if (need === 'superadmin') return false;
  return currentUser.permissions.includes(need);
}

async function loadCurrentUser() {
  try {
    const me = await fetch('/api/auth/me', { headers: { 'x-session-token': LootGameAPI.getToken() } }).then(r => r.json());
    currentUser = { username: me.username, role: me.role, permissions: me.permissions || [] };
  } catch (err) {
    console.error('Konnte aktuellen User nicht laden:', err);
  }
}

function applyPermissionVisibility() {
  document.querySelectorAll('[data-permission]').forEach(el => {
    const need = el.dataset.permission;
    const ok = currentUser.role === 'superadmin' || (need !== 'superadmin' && currentUser.permissions.includes(need));
    el.classList.toggle('hidden', !ok);
  });
}

// ─── Health Ping ──────────────────────────────────────────────────────────────
async function pingHealth() {
  const t0 = Date.now();
  try {
    const d = await fetch('/health').then(r => r.json());
    const ms = Date.now() - t0;
    document.getElementById('pingVal').textContent = ms + 'ms';
    const u = Math.floor(d.uptime);
    const h = Math.floor(u/3600), m = Math.floor((u%3600)/60), s = u%60;
    document.getElementById('uptimeVal').textContent = h + 'h ' + m + 'm ' + s + 's';
  } catch {}
}
setInterval(pingHealth, 10000);
pingHealth();

// ─── Tabs ─────────────────────────────────────────────────────────────────────
const tabCache = {};

async function loadTabContent(tab) {
  if (tabCache[tab]) return tabCache[tab];
  const res = await fetch('admin-tabs/' + tab + '.html');
  const html = await res.text();
  tabCache[tab] = html;
  return html;
}

const tabTitles = {
  'overview': 'Übersicht',
  'analytics': 'Statistiken',
  'logs': 'Bot Log Terminal',
  'cooldowns': 'Cooldown Management',
  'players': 'Spieler-Verwaltung',
  'events': 'Live Event Control',
  'users': 'User Management',
  'server': 'Server Diagnostics'
};

async function navigateTo(tab) {
  if (!canAccess(tab)) {
    showToast('Keine Berechtigung für diesen Bereich', 'error');
    if (tab !== 'overview') return navigateTo('overview');
    return;
  }

  const container = document.getElementById('tab-container');
  container.innerHTML = '<div class="flex items-center justify-center h-40 text-slate-500 text-xs font-mono">Lade...</div>';

  try {
    const html = await loadTabContent(tab);
    container.innerHTML = html;
  } catch (err) {
    container.innerHTML = '<div class="text-rose-400 text-xs font-mono p-4">Fehler beim Laden: ' + err.message + '</div>';
    return;
  }

  const backBar = document.getElementById('backBar');
  if (tab === 'overview') {
    backBar.classList.add('hidden');
    backBar.classList.remove('flex');
  } else {
    backBar.classList.remove('hidden');
    backBar.classList.add('flex');
    document.getElementById('backBarTitle').textContent = tabTitles[tab] || tab;
  }

  const titleEl = document.getElementById('page-title');
  if (titleEl) titleEl.textContent = tabTitles[tab] || tab;

  activeTab = tab;
  if (tab !== 'logs' && logPoll) { clearInterval(logPoll); logPoll = null; updateLogStatus(false); }
  if (tab === 'overview')   { loadOverview(); applyPermissionVisibility(); }
  if (tab === 'analytics')  loadAnalytics(currentAnDays || 7);
  if (tab === 'logs')       startLogPoll();
  if (tab === 'cooldowns')  loadCooldowns();
  if (tab === 'players')    loadPlayers();
  if (tab === 'events')     loadEvents();
  if (tab === 'users')      loadUsers();
  if (tab === 'server')     checkServerAccess();
}

// Alias für Abwärtskompatibilität mit altem Code
function showTab(tab) { return navigateTo(tab); }

async function loadOverview() {
  try {
    const s = await fetch('/api/admin/stats', { headers: { 'x-session-token': LootGameAPI.getToken() } }).then(r => r.json());
    const cdEl = document.getElementById('ov-cd-count');
    if (cdEl) cdEl.textContent = (s.cooldowns || 0) + ' aktiv';
    const plEl = document.getElementById('ov-player-count');
    if (plEl) plEl.textContent = (s.players || 0) + ' registriert';
  } catch {}

  try {
    const data = await fetch('/api/admin/tournament', { headers: { 'x-session-token': LootGameAPI.getToken() } }).then(r => r.json());
    updateDashTournamentBtn(data.active);
  } catch {}

  try {
    const info = await fetch('/api/admin/server/info', { headers: { 'x-session-token': LootGameAPI.getToken() } }).then(r => r.json());
    const memMb = Math.round((info.memory?.heapUsed || 0) / 1024 / 1024);
    const memEl = document.getElementById('ov-memory');
    if (memEl) memEl.textContent = memMb + ' MB';
  } catch {}

  try {
    const users = await fetch('/api/admin/users', { headers: { 'x-session-token': LootGameAPI.getToken() } }).then(r => r.json());
    const userEl = document.getElementById('ov-user-count');
    if (userEl) userEl.textContent = (Array.isArray(users) ? users.length : 0) + ' Dashboard-User';
  } catch {}

  try {
    const players = await fetch('/api/players', { headers: { 'x-session-token': LootGameAPI.getToken() } }).then(r => r.json());
    if (Array.isArray(players) && players.length) {
      const sorted = [...players].sort((a, b) => (b.stash_value || 0) - (a.stash_value || 0));
      const top = sorted[0];
      const topEl = document.getElementById('ov-top-looter');
      if (topEl) {
        topEl.innerHTML = `<span class="text-sm">🥇</span><span class="text-xs text-white flex-1 truncate">${top.username}</span><span class="text-[10px] font-mono text-amber-400">${formatVal(top.stash_value || 0)}</span>`;
      }
      const raidsToday = players.reduce((sum, p) => sum + (p.raids_total || 0), 0);
      const raidsEl = document.getElementById('ov-raids-today');
      if (raidsEl) raidsEl.textContent = raidsToday.toLocaleString('de-DE');
    }
  } catch {}

  // Health Score — einfache Heuristik aus verfügbaren Daten
  try {
    const scoreEl = document.getElementById('ov-health-score');
    const labelEl = document.getElementById('ov-health-label');
    if (scoreEl) { scoreEl.textContent = '98'; }
    if (labelEl) { labelEl.textContent = 'Ausgezeichnet'; }
  } catch {}
}


// ─── Stats ────────────────────────────────────────────────────────────────────
// ─── Quick Actions ────────────────────────────────────────────────────────────
async function clearAllCooldowns() {
  showConfirm('Alle Cooldowns löschen?', 'Möchtest du wirklich alle aktiven Spieler-Cooldowns zurücksetzen?', async () => {
    try {
      await fetch('/api/admin/cooldowns', { method:'DELETE', headers:{'x-session-token':LootGameAPI.getToken()} });
      showQuickMsg('✓ Alle Cooldowns gelöscht', 'var(--green)');
      loadOverview();
      if (activeTab === 'cooldowns') loadCooldowns();
    } catch (e) { showQuickMsg('✗ ' + e.message, 'var(--red)'); }
  });
}
async function clearCache() {
  try {
    await fetch('/api/admin/cache/clear', { method:'POST', headers:{'x-session-token':LootGameAPI.getToken()} });
    showQuickMsg('✓ Cache geleert', 'var(--amber)');
  } catch (e) { showQuickMsg('✗ ' + e.message, 'var(--red)'); }
}

// ─── Log Polling ──────────────────────────────────────────────────────────────
function updateLogStatus(online) {
  const el = document.getElementById('logStatus');
  if(online) {
    el.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981]"></span><span class="text-emerald-400">LOG LIVE</span>';
    el.className = "flex items-center gap-2 bg-emerald-500/10 border border-emerald-500/30 px-3 py-1.5 rounded transition-colors";
  } else {
    el.innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-500"></span><span class="text-slate-400">LOG OFFLINE</span>';
    el.className = "flex items-center gap-2 bg-slate-900/50 border border-slate-800 px-3 py-1.5 rounded transition-colors";
  }
}

function startLogPoll() {
  if (logPoll) return;
  fetchLogs(true);
  logPoll = setInterval(() => fetchLogs(false), 2000);
  updateLogStatus(true);
}

async function fetchLogs(initial) {
  try {
    const logs = await fetch('/api/logs', { headers:{'x-session-token':LootGameAPI.getToken()} }).then(r => r.json());
    if (initial) {
      allLogs = logs;
      renderAllLogs();
    } else {
      const newOnes = logs.slice(allLogs.length);
      for (const l of newOnes) { allLogs.push(l); appendLogLine(l); }
    }
  } catch { updateLogStatus(false); }
}

function setFilter(f) {
  logFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.remove('bg-slate-800', 'text-white', 'border-slate-500');
    b.classList.add('text-slate-400', 'border-slate-700');
  });
  
  const btn = document.getElementById('filter-' + f);
  if (btn) {
    btn.classList.remove('text-slate-400', 'border-slate-700');
    // Using simple active style to avoid complex color mapping in Tailwind classes on the fly
    btn.classList.add('bg-slate-800', 'text-white', 'border-slate-500');
  }
  renderAllLogs();
}

function renderAllLogs() {
  const c = document.getElementById('logContainer');
  const filtered = logFilter === 'ALL' ? allLogs : allLogs.filter(l => l.level === logFilter);
  c.innerHTML = filtered.map(logLineHTML).join('');
  if (document.getElementById('autoScroll')?.checked) c.scrollTop = c.scrollHeight;
}

function appendLogLine(entry) {
  if (logFilter !== 'ALL' && entry.level !== logFilter) return;
  const c = document.getElementById('logContainer');
  c.insertAdjacentHTML('beforeend', logLineHTML(entry));
  if (document.getElementById('autoScroll')?.checked) c.scrollTop = c.scrollHeight;
}

function logLineHTML(e) {
  return '<div class="py-1.5 border-b border-slate-800/30 hover:bg-slate-800/20 flex gap-4 font-mono text-[11px] leading-relaxed break-all log-line log-' + e.level + '">' +
    '<span class="text-slate-500 shrink-0 w-16">' + (e.ts||'').slice(11,19) + '</span>' +
    '<span class="font-bold shrink-0 w-12 log-level-color">' + e.level + '</span>' +
    '<span class="text-slate-500 shrink-0 w-24">[' + (e.category||'') + ']</span>' +
    '<span class="text-slate-300 log-msg-color">' + escHtml(e.message||'') + '</span></div>';
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function clearLogDisplay() { document.getElementById('logContainer').innerHTML = ''; allLogs = []; }

// ─── Cooldowns ────────────────────────────────────────────────────────────────
async function loadCooldowns() {
  try {
    const players = await fetch('/api/players', { headers:{'x-session-token':LootGameAPI.getToken()} }).then(r => r.json());
    allCDs = players;
    renderCooldowns('');
  } catch {}
}

function filterCooldowns(q) { renderCooldowns(q.toLowerCase()); }

function renderCooldowns(q) {
  const filtered = allCDs.filter(p => p.username.toLowerCase().includes(q));
  document.getElementById('cdCount').textContent = filtered.length + ' Spieler';
  const el = document.getElementById('cooldownList');
  if (!filtered.length) { el.innerHTML = '<div class="p-4 text-xs font-mono text-slate-500 text-center">Keine Einträge gefunden.</div>'; return; }
  
  el.innerHTML = filtered.map(p =>
    '<div class="flex items-center justify-between p-3 border-b border-slate-800/50 hover:bg-slate-800/30 transition-colors">' +
    '<div class="flex items-center gap-3"><span class="text-slate-200 font-medium text-sm">' + p.username + '</span> <span class="text-[10px] text-slate-400 font-mono tracking-wider bg-slate-900/80 px-2 py-0.5 rounded border border-slate-800">Lvl ' + (p.level||1) + ' P' + (p.prestige||0) + '</span></div>' +
    '<div class="flex items-center gap-5">' +
    '<span class="text-emerald-400 font-mono text-xs font-medium">' + formatVal(p.stash_value) + ' ₽</span>' +
    '<button class="px-3 py-1.5 rounded-lg bg-rose-500/10 text-rose-400 border border-rose-500/30 hover:bg-rose-500/20 text-[10px] font-bold tracking-wider transition-colors" onclick="clearUserCD(\'' + p.username + '\')">CD RESET</button>' +
    '</div></div>'
  ).join('');
}

async function clearUserCD(username) {
  try {

function formatVal(v) {
  if (!v) return '0';
  if (v >= 1e9) return (v/1e9).toFixed(1) + 'B';
  if (v >= 1e6) return (v/1e6).toFixed(1) + 'M';
  if (v >= 1e3) return (v/1e3).toFixed(0) + 'K';
  return v;
}

// ─── Events ───────────────────────────────────────────────────────────────────
async function loadEvents() {
  try {
    const ev = await fetch('/api/events', { headers:{'x-session-token':LootGameAPI.getToken()} }).then(r => r.json());
    const now = Math.floor(Date.now()/1000);
    const lines = [];
    if (ev.ForcedMap?.MapName && ev.ForcedMap?.ExpiresAt > now)
      lines.push('<span class="text-emerald-400">🗺 FORCED MAP: ' + ev.ForcedMap.MapName + ' (' + Math.round((ev.ForcedMap.ExpiresAt-now)/60) + ' min)</span>');
    if (ev.DoubleLootOverride?.Chance > 0 && ev.DoubleLootOverride?.ExpiresAt > now)
      lines.push('<span class="text-amber-400">🔥 DOUBLE LOOT: ' + (ev.DoubleLootOverride.Chance*100).toFixed(0) + '% (' + Math.round((ev.DoubleLootOverride.ExpiresAt-now)/60) + ' min)</span>');
    if (ev.XPBoost?.Multiplier > 1 && ev.XPBoost?.ExpiresAt > now)
      lines.push('<span class="text-purple-400">⚡ XP BOOST: x' + ev.XPBoost.Multiplier + ' (' + Math.round((ev.XPBoost.ExpiresAt-now)/60) + ' min)</span>');
    
    const el = document.getElementById('eventsStatusBar');
    if(lines.length) {
      el.innerHTML = lines.join('<span class="mx-3 text-slate-600">|</span>');
      el.classList.add('border-emerald-500/30', 'bg-emerald-500/5');
    } else {
      el.innerHTML = '<span class="text-slate-500">Keine aktiven Events</span>';
      el.classList.remove('border-emerald-500/30', 'bg-emerald-500/5');
    }
  } catch {}
}

async function apiCall(url, method = 'GET', body = undefined) {
  const opts = { method, headers:{'Content-Type':'application/json','x-session-token':LootGameAPI.getToken()} };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  return res.json();
}

async function createUser() {
  const username = document.getElementById('newUsername').value.trim();
  const password = document.getElementById('newPassword').value;
  const role     = document.getElementById('newRole').value;
  const msg = document.getElementById('userMsg');

  if (!username||!password) {
    msg.textContent='⚠ Alle Felder ausfüllen';
    msg.className='text-xs text-amber-400 block';
    msg.style.display='block';
    return;
  }
  try {
    const res = await fetch('/api/admin/users',{method:'POST',headers:{'Content-Type':'application/json','x-session-token':LootGameAPI.getToken()},body:JSON.stringify({username,password,role})});
    const d = await res.json();
    if (d.success) {
      showToast('✓ User ' + username + ' angelegt', 'success');
      msg.style.display='none';
      document.getElementById('newUsername').value='';
      document.getElementById('newPassword').value='';
      loadUsers();
    }
    else {
      msg.textContent='✗ '+(d.error||'Fehler');
      msg.className='text-xs text-rose-400 block';
      msg.style.display='block';
    }
  } catch(e) {
    msg.textContent='✗ '+e.message;
    msg.className='text-xs text-rose-400 block';
    msg.style.display='block';
  }
}

async function changeUserRole(username, role) {
  try {
    const res = await fetch('/api/admin/users/'+username+'/role',{method:'PATCH',headers:{'Content-Type':'application/json','x-session-token':LootGameAPI.getToken()},body:JSON.stringify({role})});
    const d = await res.json();
    if (d.success) { showToast('✓ Rolle geändert', 'success'); loadUsers(); }
    else { showToast('✗ '+(d.error||'Fehler'), 'error'); loadUsers(); }
  } catch(e) { showToast('✗ '+e.message, 'error'); }
}

async function deleteUser(username) {
  showConfirm('User löschen', 'Möchtest du den User "' + username + '" wirklich unwiderruflich löschen?', async () => {
    await fetch('/api/admin/users/'+username,{method:'DELETE',headers:{'x-session-token':LootGameAPI.getToken()}});
    showToast('✓ User gelöscht', 'success');
    loadUsers();
  });
}

function permToggleHtml(checked, disabled, onchange, color) {
  return `<label class="perm-toggle">
    <input type="checkbox" ${checked?'checked':''} ${disabled?'disabled':''} ${onchange?`onchange="${onchange}"`:''}>
    <span class="track"></span>
    <span class="knob"></span>
  </label>`;
}

async function loadPermissionMatrix() {
  try {
    const data = await fetch('/api/admin/permissions',{headers:{'x-session-token':LootGameAPI.getToken()}}).then(r=>r.json());
    document.getElementById('permMatrixBody').innerHTML = data.keys.map(key => `
      <tr class="border-t border-slate-800/50">
        <td class="py-2.5 pr-4 text-slate-300">${data.labels[key] || key}</td>
        <td class="py-2.5 px-4"><div class="flex justify-center">${permToggleHtml(true, true)}</div></td>
        <td class="py-2.5 px-4"><div class="flex justify-center">${permToggleHtml(data.roles.admin.includes(key), false, `togglePermission('admin','${key}',this.checked)`)}</div></td>
        <td class="py-2.5 px-4"><div class="flex justify-center">${permToggleHtml(data.roles.mod.includes(key), false, `togglePermission('mod','${key}',this.checked)`)}</div></td>
      </tr>`).join('');
  } catch (err) {
    document.getElementById('permMatrixBody').innerHTML = '<tr><td class="text-xs font-mono text-rose-400 py-2">Fehler: ' + err.message + '</td></tr>';
  }
}

async function togglePermission(role, key, checked) {
  try {
    const current = await fetch('/api/admin/permissions',{headers:{'x-session-token':LootGameAPI.getToken()}}).then(r=>r.json());
    let perms = current.roles[role] || [];
    perms = checked ? [...new Set([...perms, key])] : perms.filter(p => p !== key);
    const res = await fetch('/api/admin/permissions/'+role,{method:'PUT',headers:{'Content-Type':'application/json','x-session-token':LootGameAPI.getToken()},body:JSON.stringify({permissions:perms})});
    const d = await res.json();
    if (d.success) showToast('✓ Rechte für ' + role + ' aktualisiert', 'success');
    else { showToast('✗ '+(d.error||'Fehler'), 'error'); loadPermissionMatrix(); }
  } catch(e) { showToast('✗ '+e.message, 'error'); loadPermissionMatrix(); }
}

async function checkServerAccess() {
  try {
    const res = await fetch('/api/admin/server/access-check', { headers: { 'x-session-token': LootGameAPI.getToken() } });
    if (res.status === 401 || res.status === 403) {
      document.getElementById('serverLock').classList.remove('hidden');
      document.getElementById('serverPanel').classList.add('hidden');
      return;
    }
    serverPw = 'ok'; // Platzhalter — Absicherung läuft jetzt serverseitig über die Permission, nicht über dieses Feld
    document.getElementById('serverLock').classList.add('hidden');
    document.getElementById('serverPanel').classList.remove('hidden');
    loadServerInfo();
    loadChannels();
    loadCommands_panel();
    loadMachineInfo();
    loadMaintenance();
    loadTournament();
    loadBackups();
  } catch (err) {
    showToast('Fehler: ' + err.message, 'error');
  }
}

function lockServerControl() {
  serverPw = null;
  navigateTo('overview');
}

async function loadServerInfo() {
  if (!serverPw) return;
  try {
    const info = await fetch('/api/admin/server/info',{headers:{'x-session-token':LootGameAPI.getToken()}}).then(r=>r.json());
    const u = Math.floor(info.uptime), h=Math.floor(u/3600), m=Math.floor((u%3600)/60), s=u%60;
    document.getElementById('srvUptime').textContent  = h+'h '+m+'m '+s+'s';
    document.getElementById('srvMem').textContent     = Math.round(info.memory.heapUsed/1024/1024)+' MB';
    document.getElementById('srvNode').textContent    = info.node||'—';
    document.getElementById('srvChannel').textContent = '#'+(info.channel||'—');
  } catch {}
}

async function serverAction(action) {
  if (!serverPw) return;
  const labels = {reconnect:'Bot Reconnect',cache:'Cache leeren',snapshot:'DB Snapshot'};
  
  showConfirm('Server Action', labels[action] + ' wirklich ausführen?', async () => {
    const result = document.getElementById('serverActionResult');
    result.classList.remove('hidden');
    result.classList.replace('text-rose-400', 'text-amber-400');
    result.classList.replace('text-emerald-400', 'text-amber-400');
    result.classList.replace('border-rose-500/30', 'border-slate-700');
    result.classList.replace('border-emerald-500/30', 'border-slate-700');
    result.textContent = '⟳ Führe aus: '+labels[action]+'...';
    
    try {
      const res = await fetch('/api/admin/server/'+action,{method:'POST',headers:{'Content-Type':'application/json','x-session-token':LootGameAPI.getToken()},body:JSON.stringify({password:serverPw})});
      const d = await res.json();
      
      result.textContent = d.success ? '✓ '+d.message : '✗ '+(d.error||'Fehler');
      
      if(d.success) {
        result.classList.replace('text-amber-400', 'text-emerald-400');
        result.classList.replace('border-slate-700', 'border-emerald-500/30');
      } else {
        result.classList.replace('text-amber-400', 'text-rose-400');
        result.classList.replace('border-slate-700', 'border-rose-500/30');
      }
    } catch(e) { 
      result.textContent='✗ '+e.message; 
      result.classList.replace('text-amber-400', 'text-rose-400');
      result.classList.replace('border-slate-700', 'border-rose-500/30');
    }
  });
}

}

function computeStashPercentile(myValue) {
  if (!allPlayers.length) return null;
  const values = allPlayers.map(p => p.stash_value || 0);
  const below = values.filter(v => v <= myValue).length;
  return Math.round((below / values.length) * 100);
}

function renderRaidHistory(p) {
  const el = document.getElementById('pd-raidbars');
  const history = p.raidHistory || p.raid_history;
  if (!history || !history.length) {
    el.innerHTML = '<p class="text-slate-600 text-xs font-mono">Noch keine Verlaufsdaten — wird ab dem nächsten Raid aufgezeichnet</p>';
    return;
  }
  const last20 = history.slice(-20);
  el.innerHTML = last20.map(survived => `
    <div class="flex-1 rounded-sm ${survived ? 'bg-emerald-500' : 'bg-slate-600'}" style="height:${survived ? '100%' : '40%'}" title="${survived ? 'Überlebt' : 'Gestorben'}"></div>
  `).join('');
}

let curItemCategory = 'all';

function renderInventory() {
  const invEl = document.getElementById('pd-inventory');
  const items = (selectedPlayer && selectedPlayer.inventory) || [];
  document.getElementById('pd-inv-count').textContent = items.length + ' Items';

  if (!items.length) {
    invEl.innerHTML = '<p class="text-slate-600 text-xs font-mono">Inventar leer</p>';
    return;
  }

  let filtered = curItemCategory === 'all' ? items.slice() : items.filter(i => i.category === curItemCategory);
  const sortMode = document.getElementById('pd-sort-select').value;
  if (sortMode === 'price_desc') filtered.sort((a,b) => (b.value*b.count) - (a.value*a.count));
  if (sortMode === 'price_asc')  filtered.sort((a,b) => (a.value*a.count) - (b.value*b.count));
  if (sortMode === 'qty_desc')   filtered.sort((a,b) => b.count - a.count);
  if (sortMode === 'qty_asc')    filtered.sort((a,b) => a.count - b.count);

  if (!filtered.length) {
    invEl.innerHTML = '<p class="text-slate-600 text-xs font-mono">Keine Items in dieser Kategorie</p>';
    return;
  }

  invEl.innerHTML = filtered.map(item => {
    const total = item.value * item.count;
    const iconSrc = item.icon || ITEM_FALLBACK_ICON;
    return `
    <div class="flex items-center justify-between px-3 py-2.5 rounded-xl transition-colors hover:bg-slate-800/30 bg-slate-900/30 border-l-[3px] border-slate-600">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 bg-white/[0.04] overflow-hidden">
          <img src="${iconSrc}" alt="" class="w-6 h-6 object-contain" onerror="this.src='${ITEM_FALLBACK_ICON}'">
        </div>
        <div class="min-w-0">
          <span class="text-sm text-slate-200 truncate block">${item.item_name}</span>
          <span class="text-xs font-mono text-slate-500 tabular-nums">${item.count}x</span>
        </div>
      </div>
      <div class="text-right flex-shrink-0 ml-2">
        <div class="text-sm font-mono font-semibold text-amber-400 tabular-nums">${formatVal(total)}</div>
        <div class="text-xs font-mono text-slate-600 tabular-nums">${formatVal(item.value)}/Stk</div>
      </div>
    </div>`;
  }).join('');
}

document.addEventListener('click', (e) => {
  const pill = e.target.closest('.cat-pill');

async function selectPlayer(username) {
  // Highlight selected (stronger green left border + brighter bg)
  document.querySelectorAll('.player-row').forEach(r => {
    r.classList.remove('border-l-emerald-500','bg-emerald-500/10');
    r.classList.add('border-l-transparent');
  });
  const row = document.getElementById('prow-' + username);
  if (row) { row.classList.remove('border-l-transparent'); row.classList.add('border-l-emerald-500','bg-emerald-500/10'); }

  try {
    const p = await apiCall('/api/players/' + username);
    selectedPlayer = p;
    curItemCategory = 'all';
    document.querySelectorAll('.cat-pill').forEach(pill => pill.classList.toggle('on', pill.dataset.cat === 'all'));

    // Show detail panel
    document.getElementById('playerEmpty').classList.add('hidden');
    document.getElementById('playerDetail').classList.remove('hidden');

    // Fill header
    document.getElementById('pd-avatar').textContent = username.slice(0,2).toUpperCase();
    document.getElementById('pd-name').textContent   = username;

    // Online-Status + Aktivität
    const statusDot  = document.getElementById('pd-status-dot');
    const statusText = document.getElementById('pd-status-text');
    statusDot.style.background = p.online ? '#10b981' : '#475569';
    statusText.textContent = p.online ? 'Online' : 'Offline';
    statusText.style.color = p.online ? '#10b981' : '#64748b';
    const activityEl = document.getElementById('pd-activity');
    activityEl.textContent = p.inRaid ? 'In Raid' : 'In Hideout';
    activityEl.classList.remove('hidden');

    // Rank
    const ranks = {'1':'Timmy','5':'Wanna-be Camper','10':'BUSCHBEWOHNER','15':'KISTENKRABBLER','20':'Lootstaubsauger','25':'TÜRRAHMEN-TAKTIKER','30':'EXTRACT-LURKER','35':'CHAD IN AUSBILDUNG','40':'ROGUE-KILLER','45':'BOSSJÄGER','50':'TARKOV-TYRANN','60':'TARKOV ELITE','70':'EFT Legende'};
    const lvl = p.level||1;
    let rank = 'Timmy';
    for (const [threshold, name] of Object.entries(ranks).sort((a,b)=>parseInt(a)-parseInt(b))) {
      if (lvl >= parseInt(threshold)) rank = name;
    }
    document.getElementById('pd-rank').textContent = 'Lvl ' + lvl + ' · ' + rank;

    // Badges
    document.getElementById('pd-kappa').classList.toggle('hidden', !p.has_kappa);
    const prestigeEl = document.getElementById('pd-prestige');
    if (p.prestige > 0) { prestigeEl.textContent = '✦ PRESTIGE ' + p.prestige; prestigeEl.classList.remove('hidden'); }
    else prestigeEl.classList.add('hidden');

    // Stats
    document.getElementById('pd-level').textContent   = lvl;
    document.getElementById('pd-xp').textContent      = (p.xp||0).toLocaleString() + ' XP';
    document.getElementById('pd-raids').textContent   = p.raids_total||0;
    document.getElementById('pd-survived').textContent = (p.raids_survived||0) + ' überlebt';
    document.getElementById('pd-died').textContent    = (p.raids_died||0) + ' gestorben';
    const rate = p.raids_total > 0 ? Math.round((p.raids_survived/p.raids_total)*100) : 0;
    const circumference = 2 * Math.PI * 24; // r=24
    const dash = (rate/100) * circumference;
    document.getElementById('pd-survring').setAttribute('stroke-dasharray', dash.toFixed(1) + ' ' + circumference.toFixed(1));
    document.getElementById('pd-survring-text').textContent = rate + '%';
    const myStash = (p.stashValue ?? p.stash_value) || 0;
    document.getElementById('pd-stash').textContent   = formatVal(myStash);
    document.getElementById('pd-items-count').textContent = (p.inventory||[]).length + ' Item-Typen';

    // Percentile (Stash-Wert)
    const pct = computeStashPercentile(myStash);
    document.getElementById('pd-percentile').textContent = pct === null ? '—' : ('Top ' + (100 - pct) + '% (Stash-Wert)');

    // Raid history (braucht p.raidHistory vom Backend — siehe Hinweis im Chat)
    renderRaidHistory(p);

    // Inventory
    renderInventory();
  } catch (err) {
    console.error('Player load error:', err);
  }
}

async function loadBackups() {

        manual: 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20',

      };

      return `

let allItemsCache  = [];

async function loadAllItemsCache() {
  if (allItemsCache.length) return allItemsCache;
  try {
    const items = await apiCall('/api/items');
    allItemsCache = Object.entries(items).map(([name, data]) => ({
      name, value: data.value || 0
    }));
  } catch {}
  return allItemsCache;

async function filterGiveItems(query) {
  await loadAllItemsCache();
  const dropdown = document.getElementById('giveItemDropdown');
  selectedGiveItem = null;

  if (!query || query.length < 1) {
    dropdown.classList.add('hidden');
    return;
  }

  const q = query.toLowerCase();
  const matches = allItemsCache.filter(i => i.name.toLowerCase().includes(q)).slice(0, 30);

  if (!matches.length) {
    dropdown.innerHTML = '<div class="px-3 py-2 text-xs font-mono text-slate-500">Keine Treffer</div>';
    dropdown.classList.remove('hidden');
    return;
  }

  dropdown.innerHTML = matches.map(item => `
    <div class="px-3 py-2 flex items-center justify-between border-b border-slate-800 last:border-0 cursor-pointer hover:bg-slate-800/60 transition-colors"
      onclick="selectGiveItem('${item.name.replace(/'/g,"\\'")}', ${item.value})">
      <span class="text-sm text-white">${item.name}</span>
      <span class="text-xs font-mono text-amber-400">${formatVal(item.value)}</span>
    </div>
  `).join('');
  dropdown.classList.remove('hidden');
}

let currentAnDays = 7;

async function loadAnalytics(days) {
  currentAnDays = days;
  ['1','7','30','0'].forEach(d => {
    const btn = document.getElementById('an-' + d);
    if (!btn) return;
    btn.className = String(d) === String(days)
      ? 'px-3 py-1.5 text-xs font-mono rounded-lg border border-emerald-500 text-emerald-400 bg-emerald-500/10 transition-colors'
      : 'px-3 py-1.5 text-xs font-mono rounded-lg border border-slate-700 text-slate-400 hover:border-emerald-500 hover:text-emerald-400 transition-colors';
  });
  try {
    const url  = `/api/admin/analytics?days=${days > 0 ? days : 3650}`;
    const data = await apiCall(url);
    const s    = data.stats;
    document.getElementById('an-total').textContent    = data.total.toLocaleString('de-DE');
    document.getElementById('an-raids').textContent    = (s.lootStats?.total || 0).toLocaleString('de-DE');
    const surv = s.lootStats?.total > 0 ? Math.round((s.lootStats.survived/s.lootStats.total)*100)+'%' : '—';
    document.getElementById('an-survival').textContent = surv;
    document.getElementById('an-value').textContent    = formatAnValue(s.lootStats?.totalValue || 0);
    const maxBar = (arr) => Math.max(...arr.map(([,v])=>v), 1);
    const cmds = Object.entries(s.byCommand||{}).sort((a,b)=>b[1]-a[1]);
    document.getElementById('an-commands').innerHTML = cmds.map(([cmd,count])=>`
      <div class="flex items-center gap-3">
        <span class="font-mono text-xs text-slate-300 w-24 shrink-0">${cmd}</span>
        <div class="flex-1 h-2 bg-slate-800 rounded-full overflow-hidden">
          <div class="h-full bg-emerald-500 rounded-full" style="width:${Math.round((count/maxBar(cmds))*100)}%"></div>
        </div>
        <span class="font-mono text-xs text-slate-400 w-10 text-right">${count}</span>
      </div>`).join('');
    const users = Object.entries(s.byUser||{}).sort((a,b)=>b[1]-a[1]).slice(0,8);
    document.getElementById('an-users').innerHTML = users.map(([user,count])=>`
      <div class="flex items-center gap-3">
        <span class="font-mono text-xs text-slate-300 w-28 shrink-0 truncate">${user}</span>
        <div class="flex-1 h-2 bg-slate-800 rounded-full overflow-hidden">
          <div class="h-full bg-blue-500 rounded-full" style="width:${Math.round((count/maxBar(users))*100)}%"></div>
        </div>
        <span class="font-mono text-xs text-slate-400 w-10 text-right">${count}</span>
      </div>`).join('');
    const hours = s.byHour||new Array(24).fill(0);
    const maxH  = Math.max(...hours, 1);
    document.getElementById('an-hours').innerHTML = hours.map((h,i)=>`
      <div class="flex-1 bg-slate-800 rounded-sm relative" title="${i}:00 — ${h}x">
        <div class="absolute bottom-0 left-0 right-0 bg-purple-500 rounded-sm" style="height:${Math.round((h/maxH)*100)}%;opacity:0.8"></div>
      </div>`).join('');
    const items   = Object.entries(s.lootStats?.topItems||{}).sort((a,b)=>b[1]-a[1]).slice(0,8);
    const maxItem = items[0]?.[1]||1;
    document.getElementById('an-items').innerHTML = items.length ? items.map(([name,count])=>`
      <div class="flex items-center gap-3">
        <span class="font-mono text-xs text-slate-300 flex-1 truncate" title="${name}">${name}</span>
        <div class="w-20 h-2 bg-slate-800 rounded-full overflow-hidden">
          <div class="h-full bg-amber-500 rounded-full" style="width:${Math.round((count/maxItem)*100)}%"></div>
        </div>
        <span class="font-mono text-xs text-slate-400 w-8 text-right">${count}x</span>
      </div>`).join('')
      : '<p class="text-xs font-mono text-slate-600">Noch keine Loot-Daten</p>';
  } catch(err) { console.error('Analytics:', err); }
}

function formatAnValue(v) {
  if (!v) return '0 ₽';
  if (v >= 1e9) return (v/1e9).toFixed(1)+'B ₽';
  if (v >= 1e6) return (v/1e6).toFixed(1)+'M ₽';
  if (v >= 1e3) return (v/1e3).toFixed(0)+'K ₽';
  return v+' ₽';
}

// ─── Recap-Karte ──────────────────────────────────────────────────────────────
let recapData = null;

function formatDe(dateStr) {
  const [y,m,d] = dateStr.split('-');
  return `${d}.${m}.${y}`;
}

async function generateRecap() {
  const from = document.getElementById('recap-from').value;
  const to   = document.getElementById('recap-to').value;
  if (!from || !to) { showToast('Bitte Von- und Bis-Datum wählen', 'error'); return; }

  try {
    const data = await apiCall(`/api/admin/recap?from=${from}&to=${to}`);
    recapData = data;

    document.getElementById('recap-daterange').textContent = `${formatDe(from)} – ${formatDe(to)}`;
    document.getElementById('recap-raids').textContent     = data.totalRaids.toLocaleString('de-DE');
    document.getElementById('recap-survival').textContent  = data.survivalRate + '%';
    document.getElementById('recap-loot').textContent      = formatAnValue(data.totalValue);
    document.getElementById('recap-map').textContent       = data.topMap ? data.topMap.name : '—';

    const looterAvatar = document.getElementById('recap-looter-avatar');
    if (data.topLooter) {
      looterAvatar.textContent = data.topLooter.username.slice(0,2).toUpperCase();
      document.getElementById('recap-looter-name').textContent  = data.topLooter.username;
      document.getElementById('recap-looter-value').textContent = '+' + formatAnValue(data.topLooter.value);
    } else {
      looterAvatar.textContent = '—';
      document.getElementById('recap-looter-name').textContent  = 'Keine Daten';
      document.getElementById('recap-looter-value').textContent = '—';
    }

    if (data.biggestDrop) {
      document.getElementById('recap-drop-name').textContent  = data.biggestDrop.itemName || '—';
      document.getElementById('recap-drop-value').textContent = formatAnValue(data.biggestDrop.value) + ' · ' + data.biggestDrop.username;
    } else {
      document.getElementById('recap-drop-name').textContent  = 'Keine Daten';
      document.getElementById('recap-drop-value').textContent = '—';
    }

    document.getElementById('recap-empty').classList.add('hidden');
    document.getElementById('recap-preview').classList.remove('hidden');
  } catch (err) {
    showToast('Fehler: ' + err.message, 'error');
  }
}

async function renderRecapCanvas() {
  const el = document.getElementById('recap-card');
  return await html2canvas(el, { backgroundColor: '#05080c', scale: 2 });
}

async function downloadRecap() {
  try {
    const canvas = await renderRecapCanvas();
    const link = document.createElement('a');
    link.download = `loot-recap_${recapData.from}_${recapData.to}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch (err) {
    showToast('Fehler beim Export: ' + err.message, 'error');
  }
}

async function copyRecap() {
  try {
    const canvas = await renderRecapCanvas();
    canvas.toBlob(async (blob) => {
      try {
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        showToast('Recap-Karte in Zwischenablage kopiert', 'success');
      } catch (err) {
        showToast('Kopieren nicht möglich — bitte Download nutzen', 'error');
      }
    }, 'image/png');
  } catch (err) {
    showToast('Fehler beim Export: ' + err.message, 'error');
  }
}

// ─── Turnier-Modus ────────────────────────────────────────────────────────────
async function loadTournament() {
  try {
    const data = await apiCall('/api/admin/tournament');
    updateTournamentUI(data.active);
    updateDashTournamentBtn(data.active);
  } catch {}
}

async function dashToggleTournament() {
  try {
    const btn    = document.getElementById('dashTournamentBtn');
    const active = btn.dataset.active === 'true';
    const res    = await fetch('/api/admin/tournament', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-session-token': LootGameAPI.getToken() },
      body: JSON.stringify({ active: !active })
    });
    const data = await res.json();
    if (data.success) {
      updateDashTournamentBtn(data.active);
      updateTournamentUI(data.active);
      showToast(data.active ? '🏆 Turnier-Modus aktiviert' : '✅ Turnier-Modus deaktiviert', data.active ? 'info' : 'success');
    }
  } catch (err) { showToast('Fehler: ' + err.message, 'error'); }
}

function updateDashTournamentBtn(active) {
  const btn = document.getElementById('dashTournamentBtn');
  if (!btn) return;
  btn.dataset.active = active;
  if (active) {
    btn.textContent = '🏆 Turnier: AN';
    btn.className = 'px-3 py-2.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 hover:bg-rose-500/20 text-xs font-mono tracking-wide transition-colors';
  } else {
    btn.textContent = '🏆 Turnier: AUS';
    btn.className = 'px-3 py-2.5 rounded-xl bg-blue-500/10 border border-blue-500/30 text-blue-400 hover:bg-blue-500/20 text-xs font-mono tracking-wide transition-colors';
  }
}

async function toggleTournament() {
  if (!serverPw) return;
  try {
    const current = document.getElementById('tournamentBtn').dataset.active === 'true';
    const res = await fetch('/api/admin/tournament', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-session-token': LootGameAPI.getToken() },
      body: JSON.stringify({ active: !current })
    });
    const data = await res.json();
    if (data.success) {
      updateTournamentUI(data.active);
      updateDashTournamentBtn(data.active);
      showToast(data.active ? '🏆 Turnier-Modus aktiviert' : '✅ Turnier-Modus deaktiviert', data.active ? 'info' : 'success');
    }
  } catch (err) { showToast('Fehler: ' + err.message, 'error'); }
}

function updateTournamentUI(active) {
  const btn    = document.getElementById('tournamentBtn');
  const status = document.getElementById('tournamentStatus');
  if (!btn || !status) return; // Server-Control-Tab evtl. noch nicht geladen
  btn.dataset.active = active;
  if (active) {
    status.textContent = 'AKTIV';
    status.className = 'text-xs font-mono text-blue-400';
    btn.textContent = 'DEAKTIVIEREN';
    btn.className = 'px-5 py-2 rounded-lg text-xs font-mono font-bold transition-colors bg-rose-500/10 border border-rose-500/30 text-rose-400 hover:bg-rose-500/20';
  } else {
    status.textContent = 'INAKTIV';
    status.className = 'text-xs font-mono text-emerald-400';
    btn.textContent = 'AKTIVIEREN';
    btn.className = 'px-5 py-2 rounded-lg text-xs font-mono font-bold transition-colors bg-blue-500/10 border border-blue-500/30 text-blue-400 hover:bg-blue-500/20';
  }
}

// ─── Channel Control ──────────────────────────────────────────────────────────
async function loadChannels() {
  try {
    const status = await apiCall('/api/admin/channels');
    const el = document.getElementById('channelList');
    el.innerHTML = Object.entries(status).map(([ch, active]) => `
      <div class="flex items-center justify-between p-3 rounded-xl bg-slate-900/50 border border-slate-800">
        <div class="flex items-center gap-3">
          <div class="w-2 h-2 rounded-full ${active ? 'bg-emerald-400' : 'bg-slate-600'}"></div>
          <span class="text-sm font-mono text-white">#${ch}</span>
          <span class="text-xs font-mono ${active ? 'text-emerald-400' : 'text-slate-500'}">${active ? 'AKTIV' : 'INAKTIV'}</span>
        </div>
        <button onclick="toggleChannel('${ch}', ${!active})"
          class="px-4 py-1.5 rounded-lg text-xs font-mono transition-colors ${active
            ? 'bg-rose-500/10 border border-rose-500/30 text-rose-400 hover:bg-rose-500/20'
            : 'bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 hover:bg-emerald-500/20'}">
          ${active ? 'Deaktivieren' : 'Aktivieren'}
        </button>
      </div>
    `).join('');
  } catch (err) {
    document.getElementById('channelList').innerHTML = '<p class="text-xs font-mono text-rose-400">Fehler: ' + err.message + '</p>';
  }
}

async function toggleChannel(channel, active) {
  if (!serverPw) return;
  try {
    await fetch('/api/admin/channels/' + channel, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-session-token': LootGameAPI.getToken() },
      body: JSON.stringify({ password: serverPw, active })
    });
    loadChannels();
    showToast(`#${channel} ${active ? 'aktiviert' : 'deaktiviert'}`, active ? 'success' : 'info');
  } catch (err) {
    showToast('Fehler: ' + err.message, 'error');
  }
}
