<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Loot-Game Hub</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#080b1a">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/favicon-32.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<!-- Tailwind bleibt nur noch für die Tabs, die noch nicht im neuen Design sind (wird in Phase 3 entfernt) -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      fontFamily: { sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
      colors: { slate: { 50:'#eef1ff',100:'#eef1ff',200:'#cfd5f0',300:'#a3acd1',400:'#8a93b8',500:'#6b7499',600:'#4b5378',700:'#2c3354',800:'#1b2140',850:'#141a36',900:'#0f1430',950:'#080b1a' } }
    } }
  }
</script>
<link rel="stylesheet" href="css/hub-ui.css">
<link rel="stylesheet" href="css/admin-ui.css">
</head>
<body>

<!-- Icon-Sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
  <symbol id="i-terminal" viewBox="0 0 24 24"><path d="M4 17l6-5-6-5M12 19h8"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><path d="M12 7v5l3 3M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><path d="M17 20v-2a4 4 0 00-4-4H7a4 4 0 00-4 4v2M10 10a4 4 0 100-8 4 4 0 000 8zM21 20v-2a4 4 0 00-3-3.9M16 2.1a4 4 0 010 7.8"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z"/></symbol>
  <symbol id="i-server" viewBox="0 0 24 24"><path d="M4 4h16v6H4zM4 14h16v6H4zM8 7h.01M8 17h.01"/></symbol>
  <symbol id="i-activity" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2L20 3M16 7l3 3"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 00-4-5.7V5a2 2 0 10-4 0v.3A6 6 0 006 11v3.2a2 2 0 01-.6 1.4L4 17h5m6 0a3 3 0 11-6 0"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5zM3.3 7.5L12 12.5l8.7-5M12 22V12.5"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6-4.5-4.2 6.1-.7z"/></symbol>
  <symbol id="i-skull" viewBox="0 0 24 24"><path d="M12 3a8 8 0 00-5 14.2V20h10v-2.8A8 8 0 0012 3zM9 12h.01M15 12h.01M10 20v-2M14 20v-2"/></symbol>
  <symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 01-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 005.4-5.4l-2.4 2.4-2.1-.6-.6-2.1z"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0zM17 5h3v2a3 3 0 01-3 3M7 5H4v2a3 3 0 003 3"/></symbol>
  <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M5 12.5a10 10 0 0114 0M8.5 16a5 5 0 017 0M12 19.5h.01"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></symbol>
</svg>

<div class="adm">

  <!-- SIDEBAR (Desktop) -->
  <aside class="adm-side">
    <a href="/index.html" class="adm-brand" title="Zurück zum Game Center">
      <div class="brand-mark"><svg class="ic" style="stroke:#fff"><use href="#i-gear"/></svg></div>
      <div>Loot-Game <span class="muted" style="font-weight:500">Admin</span></div>
    </a>

    <nav class="adm-nav" aria-label="Hauptnavigation">
      <div class="adm-grp">Betrieb</div>
      <button onclick="navigateTo('overview')" data-nav="overview" class="adm-link"><svg class="ic"><use href="#i-home"/></svg>Übersicht</button>
      <button onclick="navigateTo('events')" data-nav="events" data-permission="events:manage" class="adm-link"><svg class="ic"><use href="#i-bolt"/></svg>Live Events</button>
      <button onclick="navigateTo('cooldowns')" data-nav="cooldowns" data-permission="cooldowns:manage" class="adm-link"><svg class="ic"><use href="#i-clock"/></svg>Cooldowns</button>

      <div class="adm-grp">Community</div>
      <button onclick="navigateTo('players')" data-nav="players" data-permission="players:view" class="adm-link"><svg class="ic"><use href="#i-users"/></svg>Spieler</button>
      <button onclick="navigateTo('squads')" data-nav="squads" data-permission="squads:manage" class="adm-link"><svg class="ic"><use href="#i-shield"/></svg>Squads</button>
      <button onclick="navigateTo('analytics')" data-nav="analytics" data-permission="analytics:view" class="adm-link"><svg class="ic"><use href="#i-chart"/></svg>Statistiken</button>

      <div class="adm-grp">System</div>
      <button onclick="navigateTo('logs')" data-nav="logs" data-permission="logs:view" class="adm-link"><svg class="ic"><use href="#i-terminal"/></svg>Bot Log</button>
      <button onclick="navigateTo('server')" data-nav="server" data-permission="server:manage" class="adm-link"><svg class="ic"><use href="#i-server"/></svg>Server</button>
      <button onclick="navigateTo('monitoring')" data-nav="monitoring" data-permission="server:manage" class="adm-link"><svg class="ic"><use href="#i-activity"/></svg>Monitoring</button>
      <button onclick="navigateTo('users')" data-nav="users" data-permission="superadmin" class="adm-link"><svg class="ic"><use href="#i-user"/></svg>User</button>
    </nav>

    <div class="adm-user">
      <div class="adm-who">
        <div class="adm-av" id="sidebarAvatar">?</div>
        <div style="flex:1;min-width:0">
          <div id="sidebarUsername" style="font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">—</div>
          <div id="sidebarRole" class="dim" style="font-size:11px">&nbsp;</div>
        </div>
      </div>
      <div class="adm-acts">
        <button id="pushBellBtn" onclick="togglePush()" title="Push-Benachrichtigungen" class="adm-sq" aria-label="Push-Benachrichtigungen">
          <svg class="ic sm"><use href="#i-bell"/></svg><span id="pushDot" class="hidden"></span>
        </button>
        <a href="/passkey-setup.html" title="Passkeys (Windows Hello)" class="adm-sq" aria-label="Passkeys"><svg class="ic sm"><use href="#i-key"/></svg></a>
        <button onclick="doLogout()" title="Abmelden" class="adm-sq danger" aria-label="Abmelden"><svg class="ic sm"><use href="#i-logout"/></svg></button>
      </div>
    </div>
  </aside>

  <div class="adm-body">

    <!-- TOP-STATUSLEISTE -->
    <header class="adm-top">
      <h1 id="page-title">Übersicht</h1>
      <div class="adm-chips">
        <div class="chip ok" id="botChip"><span class="dot" id="botDot"></span><span id="botStatusLabel">BOT ONLINE</span></div>
        <div class="chip hide-sm">Uptime <b id="uptimeVal">—</b></div>
        <div class="chip hide-sm">Ping <b id="pingVal">—</b></div>
        <div class="chip warn hide-sm" id="logStatus"><span class="dot"></span><span>LOG OFFLINE</span></div>
      </div>
    </header>

    <!-- INHALT -->
    <main class="adm-main">
      <div id="tab-container"><div class="tab-loading">Lade…</div></div>
    </main>
  </div>
</div>

<!-- MOBILE BOTTOM NAV -->
<nav class="adm-dock" aria-label="Schnellnavigation">
  <button onclick="navigateTo('overview')" data-nav="overview"><svg class="ic lg"><use href="#i-home"/></svg>Home</button>
  <button onclick="navigateTo('players')" data-nav="players" data-permission="players:view"><svg class="ic lg"><use href="#i-users"/></svg>Spieler</button>
  <button onclick="navigateTo('server')" data-nav="server" data-permission="server:manage"><svg class="ic lg"><use href="#i-server"/></svg>Server</button>
  <button onclick="toggleMobileMore()"><svg class="ic lg"><use href="#i-more"/></svg>Mehr</button>
</nav>

<!-- MOBILE "MEHR" SHEET -->
<div id="mobileMoreSheet" class="adm-sheet hidden">
  <div class="scrim" onclick="toggleMobileMore()"></div>
  <div class="panel">
    <button onclick="navigateTo('events'); toggleMobileMore();" data-permission="events:manage" class="adm-link"><svg class="ic"><use href="#i-bolt"/></svg>Live Events</button>
    <button onclick="navigateTo('cooldowns'); toggleMobileMore();" data-permission="cooldowns:manage" class="adm-link"><svg class="ic"><use href="#i-clock"/></svg>Cooldowns</button>
    <button onclick="navigateTo('squads'); toggleMobileMore();" data-permission="squads:manage" class="adm-link"><svg class="ic"><use href="#i-shield"/></svg>Squads</button>
    <button onclick="navigateTo('analytics'); toggleMobileMore();" data-permission="analytics:view" class="adm-link"><svg class="ic"><use href="#i-chart"/></svg>Statistiken</button>
    <button onclick="navigateTo('logs'); toggleMobileMore();" data-permission="logs:view" class="adm-link"><svg class="ic"><use href="#i-terminal"/></svg>Bot Log</button>
    <button onclick="navigateTo('monitoring'); toggleMobileMore();" data-permission="server:manage" class="adm-link"><svg class="ic"><use href="#i-activity"/></svg>Monitoring</button>
    <button onclick="navigateTo('users'); toggleMobileMore();" data-permission="superadmin" class="adm-link"><svg class="ic"><use href="#i-user"/></svg>User</button>
    <div style="height:1px;background:var(--line);margin:6px 0"></div>
    <button onclick="togglePush(); toggleMobileMore();" class="adm-link"><svg class="ic"><use href="#i-bell"/></svg>Push-Benachrichtigungen</button>
    <a href="/passkey-setup.html" class="adm-link"><svg class="ic"><use href="#i-key"/></svg>Passkeys</a>
    <a href="/index.html" class="adm-link"><svg class="ic"><use href="#i-home"/></svg>Game Center</a>
    <button onclick="doLogout()" class="adm-link" style="color:var(--pink)"><svg class="ic"><use href="#i-logout"/></svg>Abmelden</button>
  </div>
</div>

<!-- DIALOGE -->
<div id="toast-container" class="adm-toasts"></div>

<div id="confirm-modal" class="overlay">
  <div class="sheet" id="confirm-modal-content">
    <div class="h2" id="confirm-title" style="margin-bottom:8px">Bestätigen</div>
    <p class="muted" id="confirm-msg" style="font-size:14px;margin-bottom:20px">Möchtest du diese Aktion wirklich ausführen?</p>
    <div style="display:flex;justify-content:flex-end;gap:10px">
      <button onclick="closeConfirm()" class="btn sm">Abbrechen</button>
      <button onclick="executeConfirm()" class="btn primary sm">Bestätigen</button>
    </div>
  </div>
</div>

<!-- Dummy API für UI-Vorschau -->
<script>
  if (typeof LootGameAPI === 'undefined') {
    window.LootGameAPI = {
      isLoggedIn: () => true, getUsername: () => 'Admin', getToken: () => 'dummy-token'
    };
  }
</script>
<script src="api-client.js"></script>

<script src="js/core.js"></script>
<script src="js/live.js"></script>
<script src="js/push.js"></script>
<script src="js/overview.js"></script>
<script src="js/logs.js"></script>
<script src="js/cooldowns.js"></script>
<script src="js/events.js"></script>
<script src="js/squads.js"></script>
<script src="js/users.js"></script>
<script src="js/server.js"></script>
<script src="js/monitoring.js"></script>
<script src="js/players.js"></script>
<script src="js/analytics.js"></script>
<script src="js/passkey.js"></script>
<script src="js/passkey-banner.js"></script>
<script src="js/init.js"></script>
</body>
</html>
