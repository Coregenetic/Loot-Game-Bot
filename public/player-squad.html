<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Squad — Loot-Game Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="player-api.js"></script>
<style>
  body { background-color: #05080c; color: #e2e8f0; font-family: 'Inter', sans-serif; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
  .glass-card { background: rgba(15,23,42,0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
</style>
</head>
<body class="min-h-screen pb-10">

<header class="border-b border-slate-800/60 px-4 md:px-6 py-3 flex items-center justify-between">
  <a href="player-hub.html" class="text-xs font-mono text-slate-400 hover:text-emerald-400 transition-colors flex items-center gap-1.5">
    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
    Player Hub
  </a>
  <span class="text-xs font-semibold tracking-wide text-white uppercase">Squad</span>
</header>

<main class="max-w-2xl mx-auto p-4 md:p-6 space-y-4">

  <div id="loadingState" class="text-center py-20 text-slate-500 text-sm font-mono">Lade...</div>
  <div id="errorState" class="hidden text-center py-20"><p class="text-rose-400 text-sm" id="errorMsg"></p></div>

  <div id="content" class="hidden space-y-4">

    <!-- OFFENE EINLADUNGEN -->
    <div id="invitesCard" class="hidden glass-card border border-amber-500/30 rounded-2xl p-4" style="background:rgba(245,158,11,0.06);">
      <div class="text-[10px] font-mono text-amber-400 uppercase tracking-wide mb-3">Offene Einladungen</div>
      <div id="invitesList" class="space-y-2"></div>
    </div>

    <!-- KEIN SQUAD: ERSTELLEN -->
    <div id="noSquadCard" class="hidden glass-card border border-slate-700/50 rounded-2xl p-5">
      <h3 class="text-sm font-semibold text-white mb-1">Du bist in keinem Squad</h3>
      <p class="text-xs text-slate-500 mb-4">Erstelle ein eigenes Squad und lade bis zu 4 Mitspieler ein — ihr geht dann gemeinsam in den Raid, mit geteiltem Risiko.</p>
      <div class="flex gap-2">
        <input id="newSquadName" type="text" placeholder="Squad-Name" maxlength="40" class="flex-1 bg-slate-900/50 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:border-emerald-500 outline-none">
        <button onclick="createSquad()" class="px-4 py-2 rounded-xl bg-emerald-500 text-slate-950 font-semibold text-sm hover:bg-emerald-400 transition-colors whitespace-nowrap">Erstellen</button>
      </div>
    </div>

    <!-- SQUAD VORHANDEN -->
    <div id="squadCard" class="hidden glass-card border border-slate-700/50 rounded-2xl overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-800/60">
        <div class="flex items-start justify-between mb-3.5">
          <div>
            <div class="text-lg font-semibold text-white" id="squadName">—</div>
            <div class="text-[11px] font-mono text-slate-500 mt-0.5" id="squadLeaderLabel">—</div>
          </div>
          <button onclick="leaveSquad()" class="text-xs font-mono text-rose-400 hover:text-rose-300 transition-colors px-3 py-1.5 rounded-lg border border-rose-500/30 hover:bg-rose-500/10 shrink-0">Verlassen</button>
        </div>
        <div class="flex items-center gap-3">
          <div id="avatarStack" class="flex items-center shrink-0"></div>
          <div class="flex-1 h-1.5 bg-slate-800 rounded-full overflow-hidden">
            <div id="memberProgressBar" class="h-full bg-emerald-500 rounded-full transition-all" style="width:0%"></div>
          </div>
          <span class="text-[11px] font-mono text-emerald-400 shrink-0" id="memberCountLabel">—</span>
        </div>
      </div>

      <div class="p-5">
        <div class="text-[10px] font-mono text-slate-500 uppercase tracking-widest mb-3">Mitglieder</div>
        <div id="memberGrid" class="grid grid-cols-2 gap-2.5"></div>
      </div>
    </div>
  </div>
</main>

<script>
  let mySquad = null;
  let myUsername = null;
  let inviteTileActive = false;

  function showMsg(elId, msg, ok) {
    const el = document.getElementById(elId);
    if (!el) return;
    el.textContent = msg;
    el.className = 'text-xs font-mono mt-2 min-h-[14px] ' + (ok ? 'text-emerald-400' : 'text-rose-400');
  }

  function avatarCircleHTML(m, size, color, borderStyle) {
    const inner = m.avatarUrl
      ? `<img src="${m.avatarUrl}" alt="" class="absolute inset-0 w-full h-full object-cover" onerror="this.style.display='none'">`
      : (m.displayName || m.username).slice(0,2).toUpperCase();
    const border = borderStyle || `border:2px solid #05080c;`;
    return `<div style="width:${size}px;height:${size}px;color:${color};${border}" class="rounded-full bg-slate-800 flex items-center justify-center text-[11px] font-semibold overflow-hidden relative">${inner}</div>`;
  }

  async function loadAll() {
    try {
      const me = await PlayerAPI.me();
      myUsername = me.username;

      const [invitesData, squadData] = await Promise.all([PlayerAPI.squad.invites(), PlayerAPI.squad.my()]);

      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('content').classList.remove('hidden');

      if (invitesData.invites.length) {
        document.getElementById('invitesCard').classList.remove('hidden');
        document.getElementById('invitesList').innerHTML = invitesData.invites.map(inv => `
          <div class="flex items-center justify-between bg-slate-950/40 rounded-xl px-3 py-2.5">
            <div>
              <div class="text-sm text-white">${inv.name}</div>
              <div class="text-[10px] font-mono text-slate-500">von ${inv.leader_username}</div>
            </div>
            <div class="flex gap-2">
              <button onclick="respondInvite(${inv.squad_id}, true)" class="px-3 py-1.5 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 hover:bg-emerald-500/20 text-xs font-mono transition-colors">Annehmen</button>
              <button onclick="respondInvite(${inv.squad_id}, false)" class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-400 hover:text-white text-xs font-mono transition-colors">Ablehnen</button>
            </div>
          </div>`).join('');
      } else {
        document.getElementById('invitesCard').classList.add('hidden');
      }

      mySquad = squadData.squad;
      if (!mySquad) {
        document.getElementById('noSquadCard').classList.remove('hidden');
        document.getElementById('squadCard').classList.add('hidden');
      } else {
        document.getElementById('noSquadCard').classList.add('hidden');
        inviteTileActive = false;
        renderSquad();
      }
    } catch (err) {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('errorState').classList.remove('hidden');
      document.getElementById('errorMsg').textContent = err.message;
    }
  }

  const MEMBER_COLORS = ['#10b981', '#60a5fa', '#f59e0b', '#f472b6', '#a78bfa'];

  function renderSquad() {
    document.getElementById('squadCard').classList.remove('hidden');

    const isLeader = mySquad.leaderUsername.toLowerCase() === myUsername.toLowerCase();
    const accepted = mySquad.members.filter(m => m.status === 'accepted');
    const pending = mySquad.members.filter(m => m.status === 'pending');
    const slotsUsed = accepted.length + pending.length;

    document.getElementById('squadName').textContent = mySquad.name;
    document.getElementById('squadLeaderLabel').textContent = 'Leader: ' + mySquad.leaderUsername;
    document.getElementById('memberCountLabel').textContent = accepted.length + '/5';
    document.getElementById('memberProgressBar').style.width = (accepted.length / 5 * 100) + '%';

    const stackShown = accepted.slice(0, 3);
    const overflow = accepted.length - stackShown.length;
    let stackHTML = stackShown.map((m, i) => `<div style="margin-left:${i === 0 ? 0 : -10}px;z-index:${10-i};position:relative;">${avatarCircleHTML(m, 30, MEMBER_COLORS[i % MEMBER_COLORS.length])}</div>`).join('');
    if (overflow > 0) {
      stackHTML += `<div style="margin-left:-10px;width:30px;height:30px;" class="rounded-full bg-slate-900 border-2 border-dashed border-slate-700 flex items-center justify-center text-[10px] text-slate-500 font-mono">+${overflow}</div>`;
    }
    document.getElementById('avatarStack').innerHTML = stackHTML;

    const memberCards = mySquad.members.map((m, i) => {
      const memberIsLeader = m.username.toLowerCase() === mySquad.leaderUsername.toLowerCase();
      const isPending = m.status === 'pending';
      const color = MEMBER_COLORS[i % MEMBER_COLORS.length];
      return `
        <div class="rounded-xl p-3 flex items-center gap-2.5 ${isPending ? 'bg-amber-500/5 border border-dashed border-amber-500/30' : 'bg-slate-900/50'}">
          ${avatarCircleHTML(m, 36, color, `border:1px solid ${color}66;`)}
          <div class="min-w-0">
            <div class="text-xs ${isPending ? 'text-amber-400' : 'text-slate-200'} truncate">${m.displayName}${memberIsLeader ? ' 👑' : ''}</div>
            <div class="text-[10px] font-mono ${isPending ? 'text-amber-600' : 'text-slate-500'}">${isPending ? 'ausstehend' : 'Lvl ' + m.level}</div>
          </div>
          ${isLeader && !memberIsLeader ? `<button onclick="kickMember('${m.username}')" class="ml-auto text-slate-600 hover:text-rose-400 transition-colors shrink-0" title="Entfernen">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>` : ''}
        </div>`;
    });

    if (isLeader && slotsUsed < 5) {
      memberCards.push(inviteTileActive ? `
        <div class="rounded-xl p-2.5 border border-dashed border-emerald-500/30 bg-emerald-500/5 relative">
          <div class="flex items-center gap-1.5">
            <input id="inviteSearch" type="text" placeholder="Spieler suchen..." autocomplete="off" oninput="searchPlayers(this.value)" class="flex-1 bg-slate-950/60 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white focus:border-emerald-500 outline-none">
            <button onclick="closeInviteTile()" class="text-slate-500 hover:text-white shrink-0"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
          </div>
          <div id="inviteDropdown" class="hidden absolute z-20 left-0 right-0 mt-1 bg-slate-900 border border-slate-700 rounded-xl max-h-48 overflow-y-auto shadow-xl"></div>
          <div id="inviteMsg" class="text-[10px] font-mono mt-1.5 min-h-[12px]"></div>
        </div>` : `
        <div onclick="event.stopPropagation(); openInviteTile()" class="rounded-xl p-3 border border-dashed border-slate-700 flex items-center justify-center gap-2 cursor-pointer hover:border-emerald-500/40 hover:bg-emerald-500/5 transition-colors">
          <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          <span class="text-xs text-slate-500">Mitspieler einladen</span>
        </div>`);
    }

    document.getElementById('memberGrid').innerHTML = memberCards.join('');
    if (inviteTileActive) setTimeout(() => document.getElementById('inviteSearch')?.focus(), 0);
  }

  function openInviteTile() { inviteTileActive = true; renderSquad(); }
  function closeInviteTile() { inviteTileActive = false; renderSquad(); }

  async function createSquad() {
    const name = document.getElementById('newSquadName').value.trim();
    if (!name) return;
    try {
      await PlayerAPI.squad.create(name);
      await loadAll();
    } catch (err) { alert(err.message); }
  }

  async function respondInvite(squadId, accept) {
    try {
      await PlayerAPI.squad.respond(squadId, accept);
      await loadAll();
    } catch (err) { alert(err.message); }
  }

  async function leaveSquad() {
    if (!confirm('Squad wirklich verlassen?')) return;
    try {
      await PlayerAPI.squad.leave();
      await loadAll();
    } catch (err) { alert(err.message); }
  }

  async function kickMember(username) {
    if (!confirm(username + ' wirklich aus dem Squad entfernen?')) return;
    try {
      await PlayerAPI.squad.kick(username);
      await loadAll();
    } catch (err) { alert(err.message); }
  }

  let searchTimeout;
  function searchPlayers(q) {
    clearTimeout(searchTimeout);
    const dropdown = document.getElementById('inviteDropdown');
    if (q.trim().length < 2) { dropdown.classList.add('hidden'); return; }
    searchTimeout = setTimeout(async () => {
      try {
        const data = await PlayerAPI.squad.search(q.trim());
        if (!data.players.length) { dropdown.classList.add('hidden'); return; }
        dropdown.innerHTML = data.players.map(p => {
          const avatarInner = p.avatarUrl
            ? `<img src="${p.avatarUrl}" alt="" class="absolute inset-0 w-full h-full object-cover" onerror="this.style.display='none'">`
            : p.displayName.slice(0,2).toUpperCase();
          return `
          <div onclick="invitePlayer('${p.username}')" class="px-3 py-2 hover:bg-slate-800 cursor-pointer text-sm text-slate-200 flex items-center gap-2.5">
            <div class="w-7 h-7 rounded-lg bg-slate-800 border border-slate-700 flex items-center justify-center text-[10px] font-semibold text-slate-300 overflow-hidden relative shrink-0" style="font-family:'JetBrains Mono',monospace;">${avatarInner}</div>
            <span class="flex-1">${p.displayName}</span>
            <span class="text-[10px] font-mono text-slate-500">Lvl ${p.level}</span>
          </div>`;
        }).join('');
        dropdown.classList.remove('hidden');
      } catch (_) {}
    }, 300);
  }

  async function invitePlayer(username) {
    try {
      await PlayerAPI.squad.invite(username);
      inviteTileActive = false;
      await loadAll();
    } catch (err) {
      showMsg('inviteMsg', '✗ ' + err.message, false);
    }
  }

  document.addEventListener('click', (e) => {
    if (inviteTileActive && !e.target.closest('#memberGrid')) closeInviteTile();
  });

  if (!PlayerAPI.isLoggedIn()) {
    window.location.href = '/player-login.html';
  } else {
    loadAll();
  }
</script>
</body>
</html>
