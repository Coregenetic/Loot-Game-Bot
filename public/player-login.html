<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Hub — Loot-Game Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="player-api.js"></script>
<style>
  body { background-color: #05080c; color: #e2e8f0; font-family: 'Inter', sans-serif; }
  .bg-grid {
    position: fixed; inset: 0; z-index: -1;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 50px 50px;
    mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
    -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
  }
</style>
</head>
<body class="h-screen flex items-center justify-center p-4">
<div class="bg-grid"></div>

<div class="w-full max-w-sm">
  <div class="text-center mb-8">
    <div class="w-14 h-14 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 mx-auto mb-4">
      <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    </div>
    <h1 class="text-xl font-semibold text-white">Player Hub</h1>
    <p class="text-sm text-slate-500 mt-1">Deine Stats, Kappa-Fortschritt und Inventar</p>
  </div>

  <div class="glass-card border border-slate-700/50 rounded-2xl p-6" style="background:rgba(15,23,42,0.6);backdrop-filter:blur(16px);">
    <div id="errorBox" class="hidden mb-4 px-3 py-2 rounded-lg bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs"></div>

    <button onclick="loginWithTwitch()" class="w-full px-4 py-3 rounded-xl bg-[#9146FF] hover:bg-[#7c3aed] text-white font-semibold text-sm flex items-center justify-center gap-2 transition-colors">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L21.43 12.857V0zm13.714 12L18 14.143h-3.429l-3 3v-3H7.286V1.714h12.428z"/></svg>
      Mit Twitch einloggen
    </button>

    <p class="text-[11px] text-slate-500 mt-4 text-center leading-relaxed">
      Wir sehen nur deinen Twitch-Benutzernamen — keine E-Mail, kein Zugriff auf deinen Account.
    </p>
  </div>
</div>

<script>
  const ERRORS = {
    denied: 'Anmeldung abgebrochen.',
    invalid_state: 'Anmeldung ist abgelaufen — bitte erneut versuchen.',
    token_exchange: 'Twitch hat die Anfrage abgelehnt — bitte erneut versuchen.',
    user_lookup: 'Konnte deine Twitch-Identität nicht bestätigen.',
    server_error: 'Etwas ist schiefgelaufen — bitte erneut versuchen.'
  };

  function loginWithTwitch() {
    window.location.href = '/api/player-auth/login';
  }

  // Falls schon eingeloggt, direkt weiterleiten
  if (PlayerAPI.isLoggedIn()) {
    window.location.href = '/player-hub.html';
  }

  const params = new URLSearchParams(window.location.search);
  const err = params.get('error');
  if (err && ERRORS[err]) {
    const box = document.getElementById('errorBox');
    box.textContent = ERRORS[err];
    box.classList.remove('hidden');
  }
</script>
</body>
</html>
