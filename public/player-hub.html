<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Hub — Loot-Game Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css">
<link rel="stylesheet" href="css/hub-ui.css">
<script src="player-api.js"></script>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand"><div class="brand-mark">🎯</div><div>Loot-Game<small>Player Hub</small></div></div>
    <button class="btn sm" onclick="PlayerAPI.logout()"><i class="ti ti-logout"></i>Abmelden</button>
  </div>

  <div id="loadingState" class="state"><div class="spinner"></div>Lade deine Daten...</div>
  <div id="errorState" class="hidden state"><p class="t-pink" id="errorMsg"></p></div>

  <div id="hubContent" class="hidden stack">

    <!-- Profil -->
    <div class="card rise" style="--i:0">
      <div class="row" style="gap:18px">
        <div class="avwrap">
          <div class="ring">
            <svg viewBox="0 0 40 40">
              <defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#a56bff"/></linearGradient></defs>
              <circle class="bg" cx="20" cy="20" r="18.5" pathLength="100"/>
              <circle class="fg" id="xpRing" cx="20" cy="20" r="18.5" pathLength="100"/>
            </svg>
            <div class="av xl">
              <span id="avatarInitials">—</span>
              <img id="avatarImg" class="hidden" alt="" onerror="this.classList.add('hidden'); document.getElementById('avatarInitials').classList.remove('hidden');">
            </div>
          </div>
          <div class="lvl mono" id="levelBadge">—</div>
        </div>
        <div class="grow">
          <div class="lbl">Willkommen zurück</div>
          <div class="h1" id="usernameLabel" style="margin-top:4px;overflow:hidden;text-overflow:ellipsis">—</div>
          <div class="mono num dim" style="font-size:12px;margin-top:8px" id="xpLabel">— XP</div>
        </div>
      </div>
    </div>

    <!-- Stash + Raid -->
    <div class="grid2 sm1">
      <div class="card rise" style="--i:1">
        <div class="lbl">Stash-Wert</div>
        <div class="big t-gold num" style="margin-top:6px" id="stashValue">—</div>
        <div class="sub num" id="rankLabel">—</div>
        <div class="sub num t-green" style="margin-top:2px" id="balanceLabel">—</div>
      </div>

      <div id="raidCard" class="rise" style="--i:2">
        <div id="raidLabel" class="lbl row" style="gap:6px;color:inherit"><i class="ti ti-bolt"></i>Raid-Status</div>
        <div id="raidMain">
          <i class="ti" id="raidIconWrap"></i>
          <span id="raidTimeLabel">—</span>
        </div>
        <div id="raidSub" class="sub">—</div>
      </div>
    </div>

    <!-- Kennzahlen -->
    <div class="card pad0 rise" style="--i:3">
      <div class="grid3" style="gap:0">
        <div class="stat"><div class="v num" id="survivalRate">—</div><div class="l">Survival</div></div>
        <div class="stat" style="border-left:1px solid var(--line);border-right:1px solid var(--line)"><div class="v num" id="raidsTotal">—</div><div class="l">Raids</div></div>
        <div class="stat"><div class="v num" id="raidsSurvived">—</div><div class="l">Überlebt</div></div>
      </div>
    </div>

    <!-- Kappa -->
    <div class="card rise" style="--i:4">
      <div class="row between" style="margin-bottom:14px">
        <div class="lbl row" style="gap:6px"><i class="ti ti-chart-bar t-violet"></i>Kappa-Fortschritt</div>
        <span class="pill violet num" id="kappaFraction">—</span>
      </div>
      <div class="segbar" id="kappaBar"></div>
      <div class="sub" style="margin-top:12px" id="kappaMissing">—</div>
    </div>

    <!-- Schnellzugriff -->
    <div class="grid3 rise" style="--i:5">
      <a href="player-inventory.html" class="card sm stat"><div style="font-size:24px"><i class="ti ti-backpack t-green"></i></div><div class="l">Inventar</div></a>
      <a href="player-leaderboard.html" class="card sm stat"><div style="font-size:24px"><i class="ti ti-trophy t-gold"></i></div><div class="l">Rangliste</div></a>
      <a href="player-squad.html" class="card sm stat"><div style="font-size:24px"><i class="ti ti-users t-blue"></i></div><div class="l">Squad</div></a>
    </div>

    <!-- Verlauf -->
    <div class="card pad0 rise" style="--i:6">
      <div class="card-head lbl">Letzte Raids</div>
      <div class="list" id="raidHistory"></div>
    </div>
  </div>
</div>

<nav class="dock">
  <a href="player-hub.html" class="on"><i class="ti ti-home-2"></i><span>Hub</span></a>
  <a href="player-inventory.html"><i class="ti ti-backpack"></i><span>Inventar</span></a>
  <a href="player-leaderboard.html"><i class="ti ti-trophy"></i><span>Rangliste</span></a>
  <a href="player-squad.html"><i class="ti ti-users"></i><span>Squad</span></a>
</nav>

<script>
  let cooldownInterval = null;

  function formatVal(v) {
    if (!v) return '0 ₽';
    if (v >= 1e9) return (v/1e9).toFixed(2) + 'B ₽';
    if (v >= 1e6) return (v/1e6).toFixed(2) + 'M ₽';
    if (v >= 1e3) return (v/1e3).toFixed(0) + 'K ₽';
    return v + ' ₽';
  }

  function updateRaidCard(remaining) {
    const card = document.getElementById('raidCard');
    const sub = document.getElementById('raidSub');
    const timeLabel = document.getElementById('raidTimeLabel');
    const iconWrap = document.getElementById('raidIconWrap');

    if (remaining > 0) {
      card.dataset.state = 'cooldown';
      sub.textContent = 'Dein Raid läuft noch.';
      const m = String(Math.floor(remaining/60)).padStart(2,'0');
      const s = String(remaining%60).padStart(2,'0');
      timeLabel.textContent = m+':'+s;
      iconWrap.className = 'ti ti-clock';
    } else {
      card.dataset.state = 'ready';
      sub.textContent = 'Du kannst looten.';
      timeLabel.textContent = 'Bereit';
      iconWrap.className = 'ti ti-check';
    }
  }

  function startCooldownCountdown(remaining) {
    if (cooldownInterval) clearInterval(cooldownInterval);
    let r = remaining;
    updateRaidCard(r);
    if (r <= 0) return;
    cooldownInterval = setInterval(() => {
      r--;
      updateRaidCard(r);
      if (r <= 0) clearInterval(cooldownInterval);
    }, 1000);
  }

  async function loadHub() {
    try {
      const stats = await PlayerAPI.myStats();

      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('hubContent').classList.remove('hidden');

      document.getElementById('avatarInitials').textContent = stats.displayName.slice(0,2).toUpperCase();
      if (stats.avatarUrl) {
        const img = document.getElementById('avatarImg');
        img.src = stats.avatarUrl;
        img.classList.remove('hidden');
        document.getElementById('avatarInitials').classList.add('hidden');
      }
      document.getElementById('levelBadge').textContent = stats.level;
      document.getElementById('usernameLabel').textContent = stats.displayName;

      const xpForNext = stats.level * 10000; // grobe Anzeige, da keine exakte Kurve hier verfügbar
      const xpPct = Math.min(100, Math.round((stats.xp % xpForNext) / xpForNext * 100));
      requestAnimationFrame(() => { document.getElementById('xpRing').style.strokeDasharray = xpPct + ' 100'; });
      document.getElementById('xpLabel').textContent = stats.xp.toLocaleString('de-DE') + ' XP · ' + xpPct + '% bis Level ' + (stats.level + 1);

      document.getElementById('stashValue').textContent = formatVal(stats.stashValue);
      document.getElementById('balanceLabel').textContent = '💰 Bargeld: ' + formatVal(stats.balance || 0);
      document.getElementById('rankLabel').textContent = 'Platz ' + stats.rank + ' von ' + stats.totalPlayers;

      document.getElementById('survivalRate').textContent = stats.survivalRate + '%';
      document.getElementById('raidsTotal').textContent = stats.raidsTotal.toLocaleString('de-DE');
      document.getElementById('raidsSurvived').textContent = stats.raidsSurvived.toLocaleString('de-DE');

      document.getElementById('kappaFraction').textContent = stats.kappa.found + ' / ' + stats.kappa.total;
      const kappaBar = document.getElementById('kappaBar');
      const segments = 10;
      const filled = stats.kappa.total > 0 ? Math.round((stats.kappa.found / stats.kappa.total) * segments) : 0;
      kappaBar.innerHTML = Array.from({length: segments}, (_, i) =>
        '<div class="' + (i < filled ? 'on' : '') + '"></div>'
      ).join('');
      const remainingMissing = stats.kappa.total - stats.kappa.found - stats.kappa.missing.length;
      document.getElementById('kappaMissing').textContent = stats.kappa.missing.length
        ? 'Fehlt noch: ' + stats.kappa.missing.join(', ') + (remainingMissing > 0 ? ' +' + remainingMissing + ' weitere' : '')
        : (stats.kappa.total > 0 ? 'Du hast den Kappa-Container komplett!' : 'Noch keine Kappa-Items konfiguriert.');

      const historyEl = document.getElementById('raidHistory');
      if (!stats.recentRaids.length) {
        historyEl.innerHTML = '<p class="empty">Noch keine Raids gespielt.</p>';
      } else {
        historyEl.innerHTML = stats.recentRaids.map(function(r) {
          const date = new Date(r.ts).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
          const survived = r.survived;
          return '<div>' +
              '<div class="badge-ico ' + (survived ? 'ok' : 'bad') + '"><i class="ti ' + (survived ? 'ti-check' : 'ti-skull') + '"></i></div>' +
              '<div class="grow">' +
                '<div style="font-weight:700;font-size:14px">' + (r.map || 'Unbekannt') + '</div>' +
                '<div class="dim mono" style="font-size:11px;margin-top:2px">' + date + '</div>' +
              '</div>' +
              '<span class="num mono ' + (survived ? 't-green' : 't-pink') + '" style="font-size:13px;font-weight:700">' +
                (survived ? '+' + formatVal(r.itemValue) : 'Gestorben') +
              '</span>' +
            '</div>';
        }).join('');
      }

      startCooldownCountdown(stats.cooldownRemaining);
    } catch (err) {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('errorState').classList.remove('hidden');
      document.getElementById('errorMsg').textContent = err.message;
    }
  }

  // Token aus der URL übernehmen, falls wir gerade frisch vom Twitch-Login zurückkommen
  if (window.location.search.includes('token=')) {
    const token = new URLSearchParams(window.location.search).get('token');
    PlayerAPI.setToken(token);
    history.replaceState(null, '', window.location.pathname); // Token aus der sichtbaren URL entfernen
  }

  if (!PlayerAPI.isLoggedIn()) {
    window.location.href = '/player-login.html';
  } else {
    loadHub();
  }
</script>
</body>
</html>
