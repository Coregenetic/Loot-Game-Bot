<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard — Loot-Game Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="player-api.js"></script>
<style>
  body { background-color: #05080c; color: #e2e8f0; font-family: 'Inter', sans-serif; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
  .glass-card { background: rgba(15,23,42,0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
</style>
</head>
<body class="min-h-screen pb-10">

<header class="border-b border-slate-800/60 px-4 md:px-6 py-3 flex items-center justify-between">
  <a href="player-hub.html" class="text-xs font-mono text-slate-400 hover:text-emerald-400 transition-colors flex items-center gap-1.5">
    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
    Player Hub
  </a>
  <span class="text-xs font-semibold tracking-wide text-white uppercase">Leaderboard</span>
</header>

<main class="max-w-2xl mx-auto p-4 md:p-6 space-y-4">

  <div id="loadingState" class="text-center py-20 text-slate-500 text-sm font-mono">Lade Bestenliste...</div>
  <div id="errorState" class="hidden text-center py-20"><p class="text-rose-400 text-sm" id="errorMsg"></p></div>

  <div id="lbContent" class="hidden space-y-4">

    <!-- DEINE POSITION -->
    <div id="myPositionCard" class="glass-card border border-emerald-500/30 rounded-2xl p-4 flex items-center gap-3" style="background:rgba(16,185,129,0.06);">
      <div class="text-lg font-bold text-emerald-400 font-mono w-10 text-center shrink-0" id="myRankLabel">—</div>
      <div class="w-11 h-11 rounded-xl bg-emerald-500/10 border border-emerald-500/25 flex items-center justify-center text-sm font-semibold text-emerald-400 overflow-hidden relative shrink-0" style="font-family:'JetBrains Mono',monospace;">
        <span id="myAvatarInitials">—</span>
        <img id="myAvatarImg" class="hidden absolute inset-0 w-full h-full object-cover" alt="" onerror="this.classList.add('hidden'); document.getElementById('myAvatarInitials').classList.remove('hidden');">
      </div>
      <div class="flex-1 min-w-0">
        <div class="text-sm font-semibold text-white truncate" id="myNameLabel">—</div>
        <div class="text-[10px] font-mono text-emerald-500/70 uppercase" id="myTierLabel">Deine Position</div>
      </div>
      <div class="text-right shrink-0">
        <div class="text-sm font-semibold text-amber-400 font-mono" id="myStashLabel">—</div>
      </div>
    </div>

    <!-- PODIUM (Top 3) -->
    <div id="podiumWrap" class="grid grid-cols-3 gap-2 items-end px-2">
      <div class="flex flex-col items-center" id="podium-2">
        <div class="relative mb-2">
          <div class="w-14 h-14 rounded-full bg-slate-800 border-2 border-slate-400 overflow-hidden flex items-center justify-center text-sm font-bold text-slate-300" id="p2avatar" style="font-family:'JetBrains Mono',monospace;">—</div>
          <div class="absolute -top-2 -right-1 text-lg">🥈</div>
        </div>
        <div class="text-xs font-semibold text-slate-200 truncate max-w-[90px] text-center" id="p2name">—</div>
        <div class="text-[10px] font-mono text-amber-400" id="p2stash">—</div>
        <div class="w-full h-16 bg-gradient-to-t from-slate-700/40 to-slate-700/10 rounded-t-lg mt-2 border-t border-slate-600"></div>
      </div>
      <div class="flex flex-col items-center" id="podium-1">
        <div class="relative mb-2">
          <div class="w-[72px] h-[72px] rounded-full bg-amber-500/10 border-2 border-amber-400 overflow-hidden flex items-center justify-center text-base font-bold text-amber-300 shadow-[0_0_20px_rgba(245,158,11,0.25)]" id="p1avatar" style="font-family:'JetBrains Mono',monospace;">—</div>
          <div class="absolute -top-3 -right-1 text-2xl">👑</div>
        </div>
        <div class="text-sm font-bold text-white truncate max-w-[100px] text-center" id="p1name">—</div>
        <div class="text-xs font-mono text-amber-400 font-semibold" id="p1stash">—</div>
        <div class="w-full h-24 bg-gradient-to-t from-amber-500/15 to-amber-500/5 rounded-t-lg mt-2 border-t border-amber-500/40"></div>
      </div>
      <div class="flex flex-col items-center" id="podium-3">
        <div class="relative mb-2">
          <div class="w-14 h-14 rounded-full bg-slate-800 border-2 border-orange-700 overflow-hidden flex items-center justify-center text-sm font-bold text-orange-400" id="p3avatar" style="font-family:'JetBrains Mono',monospace;">—</div>
          <div class="absolute -top-2 -right-1 text-lg">🥉</div>
        </div>
        <div class="text-xs font-semibold text-slate-200 truncate max-w-[90px] text-center" id="p3name">—</div>
        <div class="text-[10px] font-mono text-amber-400" id="p3stash">—</div>
        <div class="w-full h-10 bg-gradient-to-t from-orange-700/25 to-orange-700/5 rounded-t-lg mt-2 border-t border-orange-700/50"></div>
      </div>
    </div>

    <!-- IN DEINER NÄHE -->
    <div id="nearbyCard" class="glass-card border border-slate-700/50 rounded-2xl overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-800/60 text-[11px] font-mono text-slate-400 uppercase tracking-wide">In deiner Nähe</div>
      <div id="nearbyList"></div>
    </div>

    <!-- TOP LISTE -->
    <div class="glass-card border border-slate-700/50 rounded-2xl overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-800/60 flex items-center justify-between">
        <span class="text-[11px] font-mono text-slate-400 uppercase tracking-wide">Top Stash-Werte</span>
        <span class="text-[10px] font-mono text-slate-500" id="totalPlayersLabel">—</span>
      </div>
      <div id="lbList"></div>
    </div>
  </div>
</main>

<script>
  function formatVal(v) {
    if (!v) return '0 ₽';
    if (v >= 1e9) return (v/1e9).toFixed(2) + 'B ₽';
    if (v >= 1e6) return (v/1e6).toFixed(2) + 'M ₽';
    if (v >= 1e3) return (v/1e3).toFixed(0) + 'K ₽';
    return v + ' ₽';
  }

  function fillAvatarOrInitials(elId, player) {
    const el = document.getElementById(elId);
    if (player.avatarUrl) {
      el.innerHTML = `<img src="${player.avatarUrl}" alt="" class="w-full h-full object-cover" onerror="this.parentElement.textContent='${player.displayName.slice(0,2).toUpperCase()}'">`;
    } else {
      el.textContent = player.displayName.slice(0,2).toUpperCase();
    }
  }

  function nearbyRowHTML(p, myUsername) {
    const isMe = p.username === myUsername;
    return `
      <div class="flex items-center gap-3 px-4 py-2 border-b border-slate-800/40 last:border-0 ${isMe ? 'bg-emerald-500/5' : ''}">
        <div class="w-7 text-center text-xs font-mono ${isMe ? 'text-emerald-400 font-bold' : 'text-slate-500'} shrink-0">#${p.rank}</div>
        <div class="text-sm ${isMe ? 'text-emerald-400 font-semibold' : 'text-slate-300'} flex-1 truncate">${p.displayName}${isMe ? ' (Du)' : ''}</div>
        <div class="text-xs font-mono text-amber-400 shrink-0">${formatVal(p.netWorth || p.stashValue)}</div>
      </div>`;
  }

  async function loadLeaderboard() {
    try {
      const data = await PlayerAPI.leaderboard(20);
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('lbContent').classList.remove('hidden');

      document.getElementById('totalPlayersLabel').textContent = data.totalPlayers + ' Spieler gesamt';

      if (data.me) {
        document.getElementById('myRankLabel').textContent = '#' + data.me.rank;
        document.getElementById('myNameLabel').textContent = data.me.displayName;
        document.getElementById('myStashLabel').textContent = formatVal(data.me.netWorth || data.me.stashValue);
        document.getElementById('myTierLabel').textContent = data.me.tier || 'Deine Position';
        document.getElementById('myAvatarInitials').textContent = data.me.displayName.slice(0,2).toUpperCase();
        if (data.me.avatarUrl) {
          const img = document.getElementById('myAvatarImg');
          img.src = data.me.avatarUrl;
          img.classList.remove('hidden');
          document.getElementById('myAvatarInitials').classList.add('hidden');
        }
      } else {
        document.getElementById('myPositionCard').classList.add('hidden');
      }

      // Podium für die Top 3
      const podiumData = { 1: data.top[0], 2: data.top[1], 3: data.top[2] };
      if (podiumData[1] && podiumData[2] && podiumData[3]) {
        document.getElementById('podiumWrap').classList.remove('hidden');
        [1,2,3].forEach(rank => {
          const p = podiumData[rank];
          fillAvatarOrInitials('p' + rank + 'avatar', p);
          document.getElementById('p' + rank + 'name').textContent = p.displayName;
          document.getElementById('p' + rank + 'stash').textContent = formatVal(p.netWorth || p.stashValue);
        });
      } else {
        document.getElementById('podiumWrap').classList.add('hidden');
      }

      // In deiner Nähe
      const nearbyCard = document.getElementById('nearbyCard');
      if (data.nearby && data.nearby.length > 1) {
        nearbyCard.classList.remove('hidden');
        document.getElementById('nearbyList').innerHTML = data.nearby.map(p => nearbyRowHTML(p, data.me?.username)).join('');
      } else {
        nearbyCard.classList.add('hidden');
      }

      // Restliche Top-Liste (ab Platz 4, da 1-3 schon im Podium stehen)
      const listEl = document.getElementById('lbList');
      const rest = data.top.slice(3);
      listEl.innerHTML = rest.map(p => {
        const isMe = data.me && p.username === data.me.username;
        return `
          <div class="flex items-center gap-3 px-4 py-2.5 border-b border-slate-800/40 last:border-0 ${isMe ? 'bg-emerald-500/5' : ''}">
            <div class="w-8 text-center text-sm font-mono text-slate-500 shrink-0">#${p.rank}</div>
            <div class="w-9 h-9 rounded-lg bg-slate-800 border border-slate-700 flex items-center justify-center text-xs font-semibold text-slate-300 overflow-hidden relative shrink-0" style="font-family:'JetBrains Mono',monospace;">
              ${p.avatarUrl
                ? `<img src="${p.avatarUrl}" alt="" class="absolute inset-0 w-full h-full object-cover" onerror="this.style.display='none'">`
                : p.displayName.slice(0,2).toUpperCase()}
            </div>
            <div class="flex-1 min-w-0">
              <div class="text-sm ${isMe ? 'text-emerald-400 font-semibold' : 'text-slate-200'} truncate">${p.displayName}${isMe ? ' (Du)' : ''}</div>
              <div class="text-[10px] font-mono text-slate-500">Level ${p.level}</div>
            </div>
            <div class="text-sm font-mono text-amber-400 shrink-0">${formatVal(p.netWorth || p.stashValue)}</div>
          </div>`;
      }).join('');
    } catch (err) {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('errorState').classList.remove('hidden');
      document.getElementById('errorMsg').textContent = err.message;
    }
  }

  if (!PlayerAPI.isLoggedIn()) {
    window.location.href = '/player-login.html';
  } else {
    loadLeaderboard();
  }
</script>
</body>
</html>
