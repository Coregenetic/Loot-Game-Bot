<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard — Loot-Game Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css">
<link rel="stylesheet" href="css/hub-ui.css">
<script src="player-api.js"></script>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand"><div class="brand-mark">🏆</div><div>Rangliste<small>Loot-Game Hub</small></div></div>
    <nav class="tabnav"><a href="player-hub.html">Hub</a><a href="player-inventory.html">Inventar</a><a href="player-leaderboard.html" class="on">Rangliste</a><a href="player-squad.html">Squad</a></nav>
    <button class="btn sm" onclick="PlayerAPI.logout()"><i class="ti ti-logout"></i>Abmelden</button>
  </div>

  <div id="loadingState" class="state"><div class="spinner"></div>Lade Bestenliste...</div>
  <div id="errorState" class="hidden state"><p class="t-pink" id="errorMsg"></p></div>

  <div id="lbContent" class="hidden stack">

    <!-- DEINE POSITION -->
    <div id="myPositionCard" class="card row rise" style="--i:0;gap:14px;background:rgba(91,140,255,.09);border-color:rgba(91,140,255,.32)">
      <div class="h2 mono t-blue num" id="myRankLabel" style="min-width:48px;text-align:center">—</div>
      <div class="av lg" style="width:52px;height:52px">
        <span id="myAvatarInitials">—</span>
        <img id="myAvatarImg" class="hidden" alt="" onerror="this.classList.add('hidden'); document.getElementById('myAvatarInitials').classList.remove('hidden');">
      </div>
      <div class="grow">
        <div style="font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" id="myNameLabel">—</div>
        <div class="lbl" style="margin-top:3px" id="myTierLabel">Deine Position</div>
      </div>
      <div class="mono t-gold num" style="font-weight:700;font-size:15px" id="myStashLabel">—</div>
    </div>

    <!-- PODIUM (Top 3) -->
    <div id="podiumWrap" class="podium rise" style="--i:1">
      <div class="slot" id="podium-2">
        <div class="medal">🥈</div>
        <div class="av lg" id="p2avatar">—</div>
        <div style="font-weight:700;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" id="p2name">—</div>
        <div class="mono t-gold num" style="font-size:12px;font-weight:700" id="p2stash">—</div>
      </div>
      <div class="slot first" id="podium-1">
        <div class="medal" style="font-size:28px">👑</div>
        <div class="av xl" id="p1avatar" style="box-shadow:0 0 0 3px rgba(255,212,119,.55),0 10px 30px rgba(255,212,119,.2)">—</div>
        <div style="font-weight:800;font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" id="p1name">—</div>
        <div class="mono t-gold num" style="font-size:13px;font-weight:700" id="p1stash">—</div>
      </div>
      <div class="slot" id="podium-3">
        <div class="medal">🥉</div>
        <div class="av lg" id="p3avatar">—</div>
        <div style="font-weight:700;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" id="p3name">—</div>
        <div class="mono t-gold num" style="font-size:12px;font-weight:700" id="p3stash">—</div>
      </div>
    </div>

    <div class="lbcols">
    <!-- IN DEINER NÄHE -->
    <div id="nearbyCard" class="card pad0 rise" style="--i:2">
      <div class="card-head lbl">In deiner Nähe</div>
      <div class="list" id="nearbyList"></div>
    </div>

    <!-- TOP LISTE -->
    <div class="card pad0 rise" style="--i:3">
      <div class="card-head row between">
        <span class="lbl">Top Stash-Werte</span>
        <span class="pill" id="totalPlayersLabel">—</span>
      </div>
      <div class="list" id="lbList"></div>
    </div>
    </div>
  </div>
</div>

<nav class="dock">
  <a href="player-hub.html"><i class="ti ti-home-2"></i><span>Hub</span></a>
  <a href="player-inventory.html"><i class="ti ti-backpack"></i><span>Inventar</span></a>
  <a href="player-leaderboard.html" class="on"><i class="ti ti-trophy"></i><span>Rangliste</span></a>
  <a href="player-squad.html"><i class="ti ti-users"></i><span>Squad</span></a>
</nav>

<script>
  function formatVal(v) {
    if (!v) return '0 ₽';
    if (v >= 1e9) return (v/1e9).toFixed(2) + 'B ₽';
    if (v >= 1e6) return (v/1e6).toFixed(2) + 'M ₽';
    if (v >= 1e3) return (v/1e3).toFixed(0) + 'K ₽';
    return v + ' ₽';
  }

  function fillAvatarOrInitials(elId, player) {
    const el = document.getElementById(elId);
    if (player.avatarUrl) {
      el.innerHTML = `<img src="${player.avatarUrl}" alt="" onerror="this.parentElement.textContent='${player.displayName.slice(0,2).toUpperCase()}'">`;
    } else {
      el.textContent = player.displayName.slice(0,2).toUpperCase();
    }
  }

  function nearbyRowHTML(p, myUsername) {
    const isMe = p.username === myUsername;
    return `
      <div style="${isMe ? 'background:rgba(91,140,255,.09)' : ''}">
        <div class="mono num ${isMe ? 't-blue' : 'dim'}" style="min-width:38px;font-size:13px;font-weight:700">#${p.rank}</div>
        <div class="grow" style="font-weight:${isMe ? 800 : 600};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.displayName}${isMe ? ' (Du)' : ''}</div>
        <div class="mono t-gold num" style="font-size:13px;font-weight:700">${formatVal(p.netWorth || p.stashValue)}</div>
      </div>`;
  }

  async function loadLeaderboard() {
    try {
      const data = await PlayerAPI.leaderboard(20);
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('lbContent').classList.remove('hidden');

      document.getElementById('totalPlayersLabel').textContent = data.totalPlayers + ' Spieler gesamt';

      if (data.me) {
        document.getElementById('myRankLabel').textContent = '#' + data.me.rank;
        document.getElementById('myNameLabel').textContent = data.me.displayName;
        document.getElementById('myStashLabel').textContent = formatVal(data.me.netWorth || data.me.stashValue);
        document.getElementById('myTierLabel').textContent = data.me.tier || 'Deine Position';
        document.getElementById('myAvatarInitials').textContent = data.me.displayName.slice(0,2).toUpperCase();
        if (data.me.avatarUrl) {
          const img = document.getElementById('myAvatarImg');
          img.src = data.me.avatarUrl;
          img.classList.remove('hidden');
          document.getElementById('myAvatarInitials').classList.add('hidden');
        }
      } else {
        document.getElementById('myPositionCard').classList.add('hidden');
      }

      // Podium für die Top 3
      const podiumData = { 1: data.top[0], 2: data.top[1], 3: data.top[2] };
      if (podiumData[1] && podiumData[2] && podiumData[3]) {
        document.getElementById('podiumWrap').classList.remove('hidden');
        [1,2,3].forEach(rank => {
          const p = podiumData[rank];
          fillAvatarOrInitials('p' + rank + 'avatar', p);
          document.getElementById('p' + rank + 'name').textContent = p.displayName;
          document.getElementById('p' + rank + 'stash').textContent = formatVal(p.netWorth || p.stashValue);
        });
      } else {
        document.getElementById('podiumWrap').classList.add('hidden');
      }

      // In deiner Nähe
      const nearbyCard = document.getElementById('nearbyCard');
      if (data.nearby && data.nearby.length > 1) {
        nearbyCard.classList.remove('hidden');
        document.getElementById('nearbyList').innerHTML = data.nearby.map(p => nearbyRowHTML(p, data.me?.username)).join('');
      } else {
        nearbyCard.classList.add('hidden');
      }

      // Restliche Top-Liste (ab Platz 4, da 1-3 schon im Podium stehen)
      const listEl = document.getElementById('lbList');
      const rest = data.top.slice(3);
      listEl.innerHTML = rest.map(p => {
        const isMe = data.me && p.username === data.me.username;
        return `
          <div style="${isMe ? 'background:rgba(91,140,255,.09)' : ''}">
            <div class="mono num dim" style="min-width:38px;font-size:13px;font-weight:700">#${p.rank}</div>
            <div class="av sm">
              ${p.avatarUrl
                ? `<img src="${p.avatarUrl}" alt="" onerror="this.style.display='none'">`
                : p.displayName.slice(0,2).toUpperCase()}
            </div>
            <div class="grow">
              <div style="font-weight:${isMe ? 800 : 600};font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.displayName}${isMe ? ' (Du)' : ''}</div>
              <div class="dim mono" style="font-size:11px">Level ${p.level}</div>
            </div>
            <div class="mono t-gold num" style="font-size:13px;font-weight:700">${formatVal(p.netWorth || p.stashValue)}</div>
          </div>`;
      }).join('');
    } catch (err) {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('errorState').classList.remove('hidden');
      document.getElementById('errorMsg').textContent = err.message;
    }
  }

  if (!PlayerAPI.isLoggedIn()) {
    window.location.href = '/player-login.html';
  } else {
    loadLeaderboard();
  }
</script>
</body>
</html>
